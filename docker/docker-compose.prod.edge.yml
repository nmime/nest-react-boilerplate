# Production public edge overlay. Select it through scripts/compose-production.mjs;
# do not combine it with COMPOSE_DOMAIN_MODE=external-proxy.

services:
  edge:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '${DOCKER_LOG_MAX_SIZE:-10m}'
        max-file: '${DOCKER_LOG_MAX_FILES:-5}'
    command:
      - caddy
      - run
      - --config
      - ${EDGE_CADDYFILE:?derived by scripts/compose-production.mjs}
      - --adapter
      - caddyfile
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN to the product base domain}
      PRIMARY_APP_UPSTREAM: ${PRIMARY_APP_UPSTREAM:?select landing-app or site-app through PRIMARY_APP}
      LANDING_APP_DOMAIN: ${LANDING_APP_DOMAIN:?derived by scripts/compose-production.mjs}
      SITE_APP_DOMAIN: ${SITE_APP_DOMAIN:?derived by scripts/compose-production.mjs}
      USER_APP_DOMAIN: ${USER_APP_DOMAIN:?derived by scripts/compose-production.mjs}
      ADMIN_APP_DOMAIN: ${ADMIN_APP_DOMAIN:?derived by scripts/compose-production.mjs}
      MOBILE_APP_DOMAIN: ${MOBILE_APP_DOMAIN:?derived by scripts/compose-production.mjs}
      AUTH_APP_API_DOMAIN: ${AUTH_APP_API_DOMAIN:?derived by scripts/compose-production.mjs}
      USER_APP_API_DOMAIN: ${USER_APP_API_DOMAIN:?derived by scripts/compose-production.mjs}
      ADMIN_APP_API_DOMAIN: ${ADMIN_APP_API_DOMAIN:?derived by scripts/compose-production.mjs}
      DISCORD_APP_API_DOMAIN: ${DISCORD_APP_API_DOMAIN:?derived by scripts/compose-production.mjs}
      TELEGRAM_BOT_API_DOMAIN: ${TELEGRAM_BOT_API_DOMAIN:?derived by scripts/compose-production.mjs}
      EDGE_OPTIONAL_ROUTES: ${EDGE_OPTIONAL_ROUTES:-default}
      EDGE_TLS_MODE: ${COMPOSE_TLS_MODE:-automatic}
    ports:
      - target: 80
        published: '${EDGE_HTTP_PORT:-80}'
        host_ip: ${EDGE_BIND_ADDRESS:-0.0.0.0}
        protocol: tcp
      - target: 443
        published: '${EDGE_HTTPS_PORT:-443}'
        host_ip: ${EDGE_BIND_ADDRESS:-0.0.0.0}
        protocol: tcp
      - target: 443
        published: '${EDGE_HTTPS_PORT:-443}'
        host_ip: ${EDGE_BIND_ADDRESS:-0.0.0.0}
        protocol: udp
    networks: [app]
    volumes:
      - ./caddy:/etc/caddy:ro
      - ${NRB_EDGE_CADDYFILE:-./caddy/Caddyfile.per-app-domains}:/nrb/Caddyfile.selected:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  caddy-data:
  caddy-config:

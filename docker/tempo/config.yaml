server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_age: 5m

compactor:
  compaction:
    compaction_window: 1h
    max_block_bytes: 1073741824
    block_retention: 48h

storage:
  trace:
    raw:
      backend: local
    wal:
      path: /tmp/tempo/wal
    backend: local
    local:
      path: /tmp/tempo/blocks

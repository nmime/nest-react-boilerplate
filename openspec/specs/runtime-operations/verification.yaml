version: 3
capability: runtime-operations
owners:
  product: runtime-maintainers
  verification: reliability-engineering
  security: security-maintainers
  operations: platform-operations
requirements:
  - id: REQ-RUNTIME-HEALTH-001
    projects:
      - '@app/backend-common-health'
    risk: high
    profiles:
      - domain
      - operations
    cucumber:
      disposition: not-applicable
      reason: Dependency health truth is proven directly at the service and operational probe layers.
      alternativeEvidence:
        - vitest
        - operations
    evidence:
      - kind: vitest
        file: libs/backend/common/health/lib/src/health.service.spec.ts
        target: '@app/backend-common-health:test'
        lanes:
          - pr
          - main
      - kind: operations
        file: packages/tooling/src/commands/qa/world-class-gates.ts
        script: test:canary
        lanes:
          - nightly
  - id: REQ-RUNTIME-RECOVERY-002
    projects:
      - '@app/backend-common-component-test'
      - '@app/backend-postgres-main'
    risk: critical
    profiles:
      - async
      - persistence
      - operations
    cucumber:
      disposition: not-applicable
      reason: Recovery behavior requires real dependency failure drills and operational execution evidence.
      alternativeEvidence:
        - component
        - operations
    evidence:
      - kind: component
        file: libs/backend/common/component-test/lib/src/testcontainer/service-containers.spec.ts
        target: '@app/backend-common-component-test:test'
        lanes:
          - main
          - nightly
      - kind: operations
        file: packages/tooling/src/commands/qa/world-class-gates.ts
        script: test:world-class
        lanes:
          - nightly

name: Deploy to cluster

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      git_sha:
        description: 'Git SHA to deploy (uses HEAD if empty)'
        required: false
        default: ''

permissions:
  contents: write
  packages: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check deployment configuration
        id: deployment
        env:
          DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$DEPLOY_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "enabled=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::GH_DEPLOY_TOKEN is required for a manual deployment"
            exit 1
          fi

          echo "::notice::Deployment is disabled because GH_DEPLOY_TOKEN is not configured"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.deployment.outputs.enabled == 'true'
        with:
          token: ${{ secrets.GH_DEPLOY_TOKEN }}
          fetch-depth: 0

      - name: Determine deployment SHA
        if: steps.deployment.outputs.enabled == 'true'
        id: sha
        run: |
          SHA="${{ github.event.inputs.git_sha }}"
          if [ -z "$SHA" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying commit: $SHORT_SHA"

      - name: Update production values image tags
        if: steps.deployment.outputs.enabled == 'true'
        run: python3 scripts/update-deploy-tags.py "${{ steps.sha.outputs.short_sha }}"

      - name: Validate Helm chart with updated values
        if: steps.deployment.outputs.enabled == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.15.4

      - name: Dry-run Helm template
        if: steps.deployment.outputs.enabled == 'true'
        run: |
          helm template nest-react-boilerplate .helm \
            -f .helm/values.yaml \
            -f .helm/values-production.yaml \
            --validate

      - name: Commit and push deployment update
        if: steps.deployment.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .helm/values-production.yaml
          if git diff --cached --quiet; then
            echo "No changes to deploy manifest — skipping commit"
            exit 0
          fi
          SHORT_SHA="${{ steps.sha.outputs.short_sha }}"
          git commit -m "deploy: update images to sha-$SHORT_SHA"
          git push origin HEAD:main

name: Nightly specification assurance

on:
  schedule:
    - cron: '21 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-specification-assurance
  cancel-in-progress: false

env:
  CI: 'true'
  NX_DAEMON: 'false'
  NX_PARALLEL: '2'
  VITEST_MAX_WORKERS: '1'
  WORLD_CLASS_COMMAND_TIMEOUT_MS: '1800000'
  NODE_VERSION_FILE: .nvmrc
  PNPM_VERSION: 11.15.1
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/nest_react_boilerplate
  ADMIN_BOOTSTRAP_ENABLED: 'true'
  ADMIN_BOOTSTRAP_EMAILS: admin@example.com
  AUTH_TELEGRAM_ENABLED: 'true'
  EXTERNAL_AUTH_AUTO_PROVISION_ENABLED: 'true'
  TELEGRAM_BOT_TOKEN: '123456789:test-bot-token'
  VITE_TELEGRAM_AUTH_ENABLED: 'true'
  RATE_LIMIT_MAX: '1000'
  COMPOSE_PROFILES: postgres,redis,nats,admin-app-api,user-app-api,auth-app-api,admin-app,user-app,landing-app,site-app
  PLAYWRIGHT_BASE_URL: http://127.0.0.1:8082
  PLAYWRIGHT_AUTO_INSTALL: '1'
  POSTGRES_PORT: '5432'
  ADMIN_APP_API_PORT: '3001'
  USER_APP_API_PORT: '3002'
  AUTH_APP_API_PORT: '3003'
  ADMIN_APP_PORT: '8081'
  USER_APP_PORT: '8082'
  LANDING_APP_PORT: '8083'
  SITE_APP_PORT: '8084'
  A11Y_URLS: http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083
  PERF_URLS: http://127.0.0.1:8082,http://127.0.0.1:8083
  PERF_API_URLS: http://127.0.0.1:3001/health,http://127.0.0.1:3002/health,http://127.0.0.1:3003/health
  SECURITY_DAST_URLS: http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083
  QA_LOAD_URLS: http://127.0.0.1:3001/health,http://127.0.0.1:3002/health,http://127.0.0.1:3003/health
  QA_CANARY_URLS: http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083,http://127.0.0.1:3001/health,http://127.0.0.1:3002/health,http://127.0.0.1:3003/health
  QA_USER_JOURNEY_COMMAND: '["pnpm","run","test:e2e:matrix","--","--project","chromium"]'
  QA_CONCURRENCY_COMMAND: '["pnpm","exec","nx","run","@app/backend-postgres-main-notification:component-test","--","src/repositories/notification-concurrency.component-spec.ts","--maxWorkers=1"]'
  QA_OBSERVABILITY_COMMAND: '["pnpm","run","test:otel","--","--maxWorkers=1"]'
  QA_RELIABILITY_URLS: http://127.0.0.1:3001/health,http://127.0.0.1:3002/health,http://127.0.0.1:3003/health
  QA_RELIABILITY_CONCURRENCY: '4'
  QA_CHAOS_URLS: http://127.0.0.1:3002/health
  QA_CHAOS_SERVICE: user-app-api
  POSTGRES_CLIENT_DOCKER_IMAGE: postgres:17.6-alpine

jobs:
  assurance:
    name: Nightly exact-SHA evidence
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install runtime tools
        run: |
          pnpm exec playwright install --with-deps chromium firefox webkit
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start local runtime stack
        run: docker compose -f docker/docker-compose.yml up -d --build
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/nest_react_boilerplate

      - name: Execute all nightly requirement evidence
        run: pnpm run spec:verify -- --all --lane nightly --report test-results/spec-evidence/nightly.json

      - name: Stop local runtime stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down --remove-orphans --volumes
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/nest_react_boilerplate

      - name: Upload nightly assurance dossier
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-specification-assurance
          path: |
            test-results/**
            coverage/**
            reports/mutation/**
          if-no-files-found: error

  report-failure:
    name: Surface Nightly specification assurance failure
    needs: [assurance]
    if: failure()
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    steps:
      # A scheduled workflow has no pull request to turn red, so a silent failure means the
      # gates it uniquely owns can rot indefinitely. Surface it as a deduplicated issue.
      - name: Open or update the Nightly specification assurance failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: 'Nightly specification assurance failed'
        run: |
          existing="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          body="The scheduled \`spec-assurance-nightly\` workflow failed. Run: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

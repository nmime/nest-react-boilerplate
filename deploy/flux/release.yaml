apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nest-react-boilerplate
  namespace: flux-system
spec:
  releaseName: nest-react-boilerplate
  targetNamespace: nest-react-boilerplate
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: ./.helm
      sourceRef:
        kind: GitRepository
        name: nest-react-boilerplate
        namespace: flux-system
      interval: 5m
      valuesFiles:
        - values.yaml
        - values-production.yaml
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  rollback:
    cleanupOnFail: true
    timeout: 10m

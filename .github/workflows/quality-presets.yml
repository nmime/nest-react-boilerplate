name: Quality presets

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NX_DAEMON: 'false'
  NODE_VERSION_FILE: .nvmrc
  PNPM_VERSION: 11.15.1

jobs:
  visual-regression-matrix:
    name: Storybook visual browser and mobile matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Storybook visual matrix
        run: pnpm run quality:visual
      - name: Upload visual matrix artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: storybook-visual-matrix
          path: |
            playwright-report/storybook-visual/**
            test-results/storybook-visual/**
          if-no-files-found: ignore

  presets:
    name: Modern QA presets
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      DATABASE_ENGINE: postgres
      AUTH_PERSISTENCE: postgres
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/nest_react_boilerplate
      CONTAINER_DATABASE_URL: postgres://postgres:postgres@postgres:5432/nest_react_boilerplate
      ADMIN_BOOTSTRAP_ENABLED: 'true'
      ADMIN_BOOTSTRAP_EMAILS: admin@example.com
      AUTH_TELEGRAM_ENABLED: 'true'
      EXTERNAL_AUTH_AUTO_PROVISION_ENABLED: 'true'
      TELEGRAM_BOT_TOKEN: '123456789:test-bot-token'
      VITE_TELEGRAM_AUTH_ENABLED: 'true'
      # Deterministic CI-only AES-256 fixture; production loads an external secret.
      NOTIFICATION_PAYLOAD_ENCRYPTION_KEY: 'BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc='
      # Six browser/device projects share the same runtime client address.
      RATE_LIMIT_MAX: '1000'
      COMPOSE_PROFILES: postgres,redis,nats,admin-app-api,user-app-api,auth-app-api,admin-app,user-app,landing-app,site-app
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8082
      PLAYWRIGHT_AUTO_INSTALL: '1'
      POSTGRES_PORT: '5432'
      ADMIN_APP_API_PORT: '3001'
      USER_APP_API_PORT: '3002'
      AUTH_APP_API_PORT: '3003'
      ADMIN_APP_PORT: '8081'
      USER_APP_PORT: '8082'
      LANDING_APP_PORT: '8083'
      SITE_APP_PORT: '4203'
      NRB_IMAGE_COMPILE: '1'
      NRB_CLOSURE_CONTEXT: ${{ github.workspace }}/.nrb/reference/postgres
      FRONTEND_RUNTIME_ALLOW_LOOPBACK_HTTP: 'true'
      LANDING_ADMIN_APP_URL: http://127.0.0.1:8081
      LANDING_USER_APP_URL: http://127.0.0.1:8082
      # This lane has a live stack, so the fuzz gate must actually send its generated cases
      # instead of reporting ok with zero requests.
      OPENAPI_FUZZ_BASE_URL: http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:3003
      OPENAPI_FUZZ_REQUIRE_TARGET: '1'
      # The matrix must fail rather than skip when the stack is not reachable.
      PLAYWRIGHT_REQUIRE_STACK: '1'
      # Quarantined specs are excluded from the blocking lane, so exercise them here.
      PLAYWRIGHT_INCLUDE_QUARANTINED: '1'
      A11Y_URLS: http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083
      PERF_URLS: http://127.0.0.1:8082,http://127.0.0.1:8083
      PERF_API_URLS: http://127.0.0.1:3001/health,http://127.0.0.1:3002/health,http://127.0.0.1:3003/health
      SECURITY_DAST_URLS: http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083
      QA_LOAD_URLS: http://127.0.0.1:3001/health,http://127.0.0.1:3002/health,http://127.0.0.1:3003/health
      QA_CANARY_URLS: http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083,http://127.0.0.1:3001/health,http://127.0.0.1:3002/health,http://127.0.0.1:3003/health
      QA_CHAOS_URLS: http://127.0.0.1:3002/health
      QA_CHAOS_SERVICE: user-app-api
      QA_USER_JOURNEY_COMMAND: '["pnpm","run","test:e2e:matrix","--","--project","chromium"]'
      QA_CONCURRENCY_COMMAND: '["pnpm","exec","nx","run","@app/backend-postgres-main-notification:component-test","--","src/repositories/notification-concurrency.component-spec.ts","--maxWorkers=1"]'
      QA_OBSERVABILITY_COMMAND: '["pnpm","run","test:otel","--","--maxWorkers=1"]'
      POSTGRES_CLIENT_DOCKER_IMAGE: postgres:17.6-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser matrix
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Materialize explicit PostgreSQL reference build context
        run: pnpm nrb closure materialize --all-reference --provider postgres
      - name: Start local runtime stack
        uses: ./.github/actions/runtime-stack
      - name: Run quality presets
        run: pnpm run quality:presets
      - name: Docker smoke and fullstack (compiled images)
        env:
          NRB_IMAGE_COMPILE: '1'
        run: |
          pnpm run test:docker-smoke
          pnpm run test:compose-deployment-modes
          pnpm run test:fullstack
      - name: Stop local runtime stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down --remove-orphans --volumes
      - name: Upload test result artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: quality-preset-results
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore

  report-failure:
    name: Surface Nightly quality presets failure
    needs: [visual-regression-matrix, presets]
    if: failure()
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open or update the Nightly quality presets failure issue
        uses: ./.github/actions/report-scheduled-failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        with:
          title: 'Nightly quality presets failed'
          workflow-file: quality-presets.yml
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

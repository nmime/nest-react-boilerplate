title = "Product Gitleaks configuration"

# Product-owned. Add this product's narrow fixture allowlists here; the boilerplate's own live in
# the base config below and are rewritten on every upstream sync, so editing that file guarantees a
# conflict in exactly the region upstream keeps touching.
#
# The chain is this file -> the base -> the gitleaks defaults. Do not add `useDefault` here: a
# config may declare either `path` or `useDefault`, and replacing `path` would drop the base rules
# and every boilerplate allowlist with them. `path` is resolved against the directory gitleaks was
# invoked from, which is why the scan sets the container's working directory to the workspace.
[extend]
path = "packages/tooling/config/gitleaks.base.toml"

# Narrow fixtures only. Every entry names both an anchored path and the literal value it admits:
#
#   [[rules]]
#   id = "generic-api-key"
#
#   [[rules.allowlists]]
#   description = "<why this value is not a credential>"
#   condition = "AND"
#   paths = ['''^libs/backend/feature/<domain>/.../<file>\.spec\.ts$''']
#   regexes = ['''<the literal fixture value>''']
#
# A path exclusion without `regexes`, or a `paths` entry broad enough to cover a directory, disables
# the gate for everything under it. Never allowlist a real credential — rotate it instead.

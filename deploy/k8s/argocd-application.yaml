apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nest-react-boilerplate
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nmime/nest-react-boilerplate.git
    targetRevision: main
    path: .helm
    helm:
      valueFiles:
        - values.yaml
        - ../deploy/k8s/values.yaml
      parameters:
        - name: "imagePullSecrets[0].name"
          value: "ghcr-credentials"
          forceString: true
  destination:
    server: https://kubernetes.default.svc
    namespace: nest-react-boilerplate
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true

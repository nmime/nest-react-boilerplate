name: Deploy to cluster

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      git_sha:
        description: 'Git SHA to deploy (uses HEAD if empty)'
        required: false
        default: ''

permissions:
  contents: write
  packages: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.GH_DEPLOY_TOKEN }}
          fetch-depth: 0

      - name: Determine deployment SHA
        id: sha
        run: |
          SHA="${{ github.event.inputs.git_sha }}"
          if [ -z "$SHA" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying commit: $SHORT_SHA"

      - name: Update production values image tags
        run: python3 scripts/update-deploy-tags.py "${{ steps.sha.outputs.short_sha }}"

      - name: Validate Helm chart with updated values
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.15.4

      - name: Dry-run Helm template
        run: |
          helm template nest-react-boilerplate .helm \
            -f .helm/values.yaml \
            -f .helm/values-production.yaml \
            --validate

      - name: Commit and push deployment update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .helm/values-production.yaml
          if git diff --cached --quiet; then
            echo "No changes to deploy manifest — skipping commit"
            exit 0
          fi
          SHORT_SHA="${{ steps.sha.outputs.short_sha }}"
          git commit -m "deploy: update images to sha-$SHORT_SHA"
          git push origin HEAD:main

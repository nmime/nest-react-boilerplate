{{- $databaseEngine := include "boilerplate.databaseEngine" . -}}
{{- if or (eq (include "boilerplate.hasBackendWorkloads" .) "true") .Values.migrations.enabled .Values.backups.enabled -}}
{{- if .Values.secrets.existingSecret }}
{{- /* External secret supplied; do not render an in-chart Secret. */ -}}
{{- else if .Values.secrets.create }}
{{- $sessionSecret := required "secrets.sessionSecret is required when secrets.create=true" .Values.secrets.sessionSecret -}}
{{- $betterAuthSecret := required "secrets.betterAuthSecret is required when secrets.create=true" .Values.secrets.betterAuthSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "boilerplate.secretName" . }}
  labels:
    {{- include "boilerplate.labels" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_SECRET: {{ $sessionSecret | quote }}
  {{- if .Values.secrets.authLoginAnalyticsIpHashSecret }}
  AUTH_LOGIN_ANALYTICS_IP_HASH_SECRET: {{ .Values.secrets.authLoginAnalyticsIpHashSecret | quote }}
  {{- end }}
  BETTER_AUTH_SECRET: {{ $betterAuthSecret | quote }}
  {{- if eq $databaseEngine "postgres" }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required for PostgreSQL when secrets.create=true" .Values.secrets.databaseUrl | quote }}
  {{- else }}
  {{- $mongodbUri := required "secrets.mongodbUri is required for MongoDB when secrets.create=true" .Values.secrets.mongodbUri }}
  {{- if not (regexMatch `(?i)[?&]replicaset=[^&]+` $mongodbUri) }}
  {{- fail "secrets.mongodbUri must include a non-empty replicaSet URI option" }}
  {{- end }}
  MONGODB_URI: {{ $mongodbUri | quote }}
  {{- end }}
  {{- if .Values.secrets.telegramBotToken }}
  TELEGRAM_BOT_TOKEN: {{ .Values.secrets.telegramBotToken | quote }}
  {{- end }}
  {{- if .Values.secrets.telegramOidcClientSecret }}
  TELEGRAM_OIDC_CLIENT_SECRET: {{ .Values.secrets.telegramOidcClientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.notificationPayloadEncryptionKey }}
  NOTIFICATION_PAYLOAD_ENCRYPTION_KEY: {{ .Values.secrets.notificationPayloadEncryptionKey | quote }}
  {{- end }}
  {{- if .Values.secrets.resendApiKey }}
  RESEND_API_KEY: {{ .Values.secrets.resendApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.mailpaceServerToken }}
  MAILPACE_SERVER_TOKEN: {{ .Values.secrets.mailpaceServerToken | quote }}
  {{- end }}
  {{- if .Values.secrets.notificationFcmPrivateKey }}
  NOTIFICATION_FCM_PRIVATE_KEY: {{ .Values.secrets.notificationFcmPrivateKey | quote }}
  {{- end }}
  {{- if .Values.secrets.notificationApnsPrivateKey }}
  NOTIFICATION_APNS_PRIVATE_KEY: {{ .Values.secrets.notificationApnsPrivateKey | quote }}
  {{- end }}
{{- else }}
{{- fail "Set secrets.existingSecret, or set secrets.create=true with the required application and selected database secrets." }}
{{- end }}
{{- if and (eq $databaseEngine "mongodb") .Values.migrations.enabled .Values.secrets.create (not .Values.migrations.mongodbExistingSecret) }}
{{- $migrationUri := required "secrets.mongodbMigrationUri is required for MongoDB when migrations are enabled and secrets.create=true" .Values.secrets.mongodbMigrationUri }}
{{- $runtimeIdentity := include "boilerplate.mongodbPrincipalIdentity" .Values.secrets.mongodbUri }}
{{- $migrationIdentity := include "boilerplate.mongodbPrincipalIdentity" $migrationUri }}
{{- if eq $migrationIdentity $runtimeIdentity }}
{{- fail "secrets.mongodbMigrationUri must use a username/auth database identity distinct from secrets.mongodbUri" }}
{{- end }}
{{- if not (regexMatch `(?i)[?&]replicaset=[^&]+` $migrationUri) }}
{{- fail "secrets.mongodbMigrationUri must include a non-empty replicaSet URI option" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "boilerplate.mongodbMigrationSecretName" . }}
  labels:
    {{- include "boilerplate.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
type: Opaque
stringData:
  MONGODB_MIGRATION_URI: {{ $migrationUri | quote }}
{{- end }}
{{- if and (eq $databaseEngine "mongodb") .Values.backups.enabled .Values.secrets.create (not .Values.backups.mongodb.existingSecret) }}
{{- $backupRestoreUri := required "secrets.mongodbBackupRestoreUri is required for MongoDB when backups are enabled and secrets.create=true" .Values.secrets.mongodbBackupRestoreUri }}
{{- $runtimeIdentity := include "boilerplate.mongodbPrincipalIdentity" .Values.secrets.mongodbUri }}
{{- $backupRestoreIdentity := include "boilerplate.mongodbPrincipalIdentity" $backupRestoreUri }}
{{- if eq $backupRestoreIdentity $runtimeIdentity }}
{{- fail "secrets.mongodbBackupRestoreUri must use a username/auth database identity distinct from runtime" }}
{{- end }}
{{- if and .Values.migrations.enabled (not .Values.migrations.mongodbExistingSecret) .Values.secrets.mongodbMigrationUri }}
{{- $migrationIdentity := include "boilerplate.mongodbPrincipalIdentity" .Values.secrets.mongodbMigrationUri }}
{{- if eq $backupRestoreIdentity $migrationIdentity }}
{{- fail "secrets.mongodbBackupRestoreUri must use a username/auth database identity distinct from migration" }}
{{- end }}
{{- end }}
{{- if not (regexMatch `(?i)^mongodb(\+srv)?://[^/]+/(\?[^#]*)?$` $backupRestoreUri) }}
{{- fail "secrets.mongodbBackupRestoreUri must be deployment-wide and must not select a database path" }}
{{- end }}
{{- if not (regexMatch `(?i)[?&]authsource=admin(?:&|$)` $backupRestoreUri) }}
{{- fail "secrets.mongodbBackupRestoreUri must use authSource=admin" }}
{{- end }}
{{- if not (regexMatch `(?i)[?&]replicaset=[^&]+` $backupRestoreUri) }}
{{- fail "secrets.mongodbBackupRestoreUri must include a non-empty replicaSet URI option" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "boilerplate.mongodbBackupRestoreSecretName" . }}
  labels:
    {{- include "boilerplate.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb-backup-restore
type: Opaque
stringData:
  MONGODB_BACKUP_RESTORE_URI: {{ $backupRestoreUri | quote }}
{{- end }}
{{- end }}

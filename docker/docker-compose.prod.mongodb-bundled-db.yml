# Production database overlay: a single-node authenticated MongoDB replica set.
# This topology supports transactions but is not highly available.

x-mongodb-env: &mongodb-env
  DATABASE_ENGINE: mongodb
  AUTH_PERSISTENCE: mongodb
  MONGODB_USER: ${MONGODB_USER:-nest_react_boilerplate}
  MONGODB_DATABASE: ${MONGODB_DATABASE:-nest_react_boilerplate}
  MONGODB_REPLICA_SET: ${MONGODB_REPLICA_SET:-rs0}
  MONGODB_MIN_POOL_SIZE: ${MONGODB_MIN_POOL_SIZE:-2}
  MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-10}
  MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-10000}

services:
  mongodb:
    image: mongo:8.0.12-noble
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '${DOCKER_LOG_MAX_SIZE:-10m}'
        max-file: '${DOCKER_LOG_MAX_FILES:-5}'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USER:-nrb_root}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongodb_root_password
      MONGODB_REPLICA_SET: ${MONGODB_REPLICA_SET:-rs0}
    entrypoint: ['/bin/bash', '/opt/mongodb/start-authenticated-replica-set.sh']
    volumes:
      - mongodb-data:/data/db
      - ./mongodb:/opt/mongodb:ro
    networks: [database]
    secrets: [mongodb_root_password, mongodb_keyfile]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --host 127.0.0.1 --port 27017 --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$$(cat /run/secrets/mongodb_root_password)" --authenticationDatabase admin --quiet --eval "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mongodb-init:
    image: mongo:8.0.12-noble
    restart: 'no'
    environment:
      MONGODB_HOST: mongodb
      MONGODB_ROOT_USER: ${MONGODB_ROOT_USER:-nrb_root}
      MONGODB_USER: ${MONGODB_USER:-nest_react_boilerplate}
      MONGODB_MIGRATION_USER: ${MONGODB_MIGRATION_USER:-nest_react_boilerplate_migration}
      MONGODB_BACKUP_RESTORE_USER: ${MONGODB_BACKUP_RESTORE_USER:-nrb_backup_restore}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-nest_react_boilerplate}
      MONGODB_REPLICA_SET: ${MONGODB_REPLICA_SET:-rs0}
    entrypoint: ['/bin/bash', '/opt/mongodb/prepare-production-replica-set.sh']
    volumes:
      - ./mongodb:/opt/mongodb:ro
    networks: [database]
    secrets: [mongodb_root_password, mongodb_password, mongodb_migration_password, mongodb_backup_restore_password]
    depends_on:
      mongodb:
        condition: service_healthy

  migrate:
    environment:
      <<: *mongodb-env
      MONGODB_USER: ${MONGODB_MIGRATION_USER:-nest_react_boilerplate_migration}
    secrets: [mongodb_migration_password]
    depends_on:
      mongodb-init:
        condition: service_completed_successfully

  admin-app-api:
    environment: *mongodb-env
    secrets: [mongodb_password]
    depends_on:
      mongodb-init:
        condition: service_completed_successfully

  user-app-api:
    environment: *mongodb-env
    secrets: [mongodb_password]
    depends_on:
      mongodb-init:
        condition: service_completed_successfully

  auth-app-api:
    environment: *mongodb-env
    secrets: [mongodb_password]
    depends_on:
      mongodb-init:
        condition: service_completed_successfully

  discord-app-api:
    environment: *mongodb-env
    secrets: [mongodb_password]
    depends_on:
      mongodb-init:
        condition: service_completed_successfully

  telegram-bot-api:
    environment: *mongodb-env
    secrets: [mongodb_password]
    depends_on:
      mongodb-init:
        condition: service_completed_successfully

  notification-scheduler:
    environment: *mongodb-env
    secrets: [mongodb_password]
    depends_on:
      mongodb-init:
        condition: service_completed_successfully

  notification-consumer:
    environment: *mongodb-env
    secrets: [mongodb_password]
    depends_on:
      mongodb-init:
        condition: service_completed_successfully

volumes:
  mongodb-data:

secrets:
  mongodb_root_password:
    file: ${MONGODB_ROOT_PASSWORD_FILE:-./secrets/mongodb_root_password.txt}
  mongodb_password:
    file: ${MONGODB_PASSWORD_FILE:-./secrets/mongodb_password.txt}
  mongodb_migration_password:
    file: ${MONGODB_MIGRATION_PASSWORD_FILE:-./secrets/mongodb_migration_password.txt}
  mongodb_backup_restore_password:
    file: ${MONGODB_BACKUP_RESTORE_PASSWORD_FILE:-./secrets/mongodb_backup_restore_password.txt}
  mongodb_keyfile:
    file: ${MONGODB_KEYFILE_FILE:-./secrets/mongodb_keyfile.txt}

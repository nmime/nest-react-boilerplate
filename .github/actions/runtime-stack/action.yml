name: Local runtime stack
description: Build and start the Compose runtime stack, retrying transient cold starts and dumping diagnostics when it stays down.

# Three lanes need a live stack: ci.yml `ops-gates`, quality-presets `presets`,
# and spec-assurance-nightly. Only `ops-gates` ever grew a retry, so the two
# nightly lanes failed on their first bad cold start and stayed red for 32
# nights with nothing in the log but "container is unhealthy". Keep the start
# sequence in one place so the drift cannot come back, and always print why a
# service never reported healthy.

inputs:
  compose-file:
    description: Compose file to bring up.
    required: false
    default: docker/docker-compose.yml
  attempts:
    description: How many times to try starting the stack before failing the step.
    required: false
    default: '3'
  readiness-timeout:
    description: Seconds to wait for every long-running service to report healthy.
    required: false
    default: '300'

runs:
  using: composite
  steps:
    - name: Start local runtime stack
      shell: bash
      env:
        COMPOSE_FILE_PATH: ${{ inputs.compose-file }}
        START_ATTEMPTS: ${{ inputs.attempts }}
        READINESS_TIMEOUT: ${{ inputs.readiness-timeout }}
      run: |
        set -uo pipefail

        dump_diagnostics() {
          echo "::group::Compose service state"
          docker compose -f "$COMPOSE_FILE_PATH" ps --all || true
          echo "::endgroup::"

          # A failed start prints only "container is unhealthy". The reason is in
          # the service log and the last healthcheck probe, so surface both.
          for container in $(docker compose -f "$COMPOSE_FILE_PATH" ps --all --quiet); do
            name="$(docker inspect --format '{{.Name}}' "$container" 2>/dev/null | sed 's|^/||')"
            state="$(docker inspect --format '{{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} exit={{.State.ExitCode}}' "$container" 2>/dev/null)"
            echo "::group::${name:-$container} ($state)"
            docker inspect \
              --format '{{if .State.Health}}{{range .State.Health.Log}}--- probe exit={{.ExitCode}}{{"\n"}}{{.Output}}{{end}}{{else}}no healthcheck{{end}}' \
              "$container" 2>/dev/null | tail -40 || true
            docker logs --tail 80 "$container" 2>&1 || true
            echo "::endgroup::"
          done
        }

        # `up --wait` cannot be used here: it treats the one-shot `migrate`
        # service exiting 0 as a failed wait. Assert readiness explicitly so the
        # frontend services — which plain `up -d` starts without waiting for —
        # are serving before any gate runs.
        assert_ready() {
          local deadline=$((SECONDS + READINESS_TIMEOUT))

          while [ "$SECONDS" -lt "$deadline" ]; do
            local pending=''
            local failed=''

            for container in $(docker compose -f "$COMPOSE_FILE_PATH" ps --all --quiet); do
              local name status health exit_code
              name="$(docker inspect --format '{{.Name}}' "$container" 2>/dev/null | sed 's|^/||')"
              status="$(docker inspect --format '{{.State.Status}}' "$container" 2>/dev/null)"
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container" 2>/dev/null)"
              exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$container" 2>/dev/null)"

              # One-shot jobs (migrations, replica-set preparation) have no
              # healthcheck and are done when they exit cleanly.
              if [ "$health" = 'none' ]; then
                if [ "$status" = 'exited' ] && [ "$exit_code" != '0' ]; then
                  failed="${failed} ${name}(exit=${exit_code})"
                elif [ "$status" != 'exited' ] && [ "$status" != 'running' ]; then
                  pending="${pending} ${name}(${status})"
                fi
                continue
              fi

              case "$health" in
                healthy) ;;
                unhealthy) failed="${failed} ${name}(unhealthy)" ;;
                *) pending="${pending} ${name}(${health})" ;;
              esac
            done

            if [ -n "$failed" ]; then
              echo "::warning::Unhealthy service(s):${failed}"
              return 1
            fi

            if [ -z "$pending" ]; then
              return 0
            fi

            sleep 5
          done

          echo "::warning::Timed out after ${READINESS_TIMEOUT}s waiting for the runtime stack."
          return 1
        }

        for attempt in $(seq 1 "$START_ATTEMPTS"); do
          if docker compose -f "$COMPOSE_FILE_PATH" up -d --build && assert_ready; then
            echo "Runtime stack ready on attempt ${attempt}."
            exit 0
          fi

          echo "::warning::Runtime stack start attempt ${attempt} failed."
          dump_diagnostics

          if [ "$attempt" -eq "$START_ATTEMPTS" ]; then
            echo "::error::Runtime stack failed to start after ${attempt} attempt(s)."
            exit 1
          fi

          # Reset to a clean slate so a half-started stack cannot poison the
          # retry, then back off to let the runner recover CPU and IO.
          docker compose -f "$COMPOSE_FILE_PATH" down --remove-orphans --volumes || true
          sleep "$((attempt * 15))"
        done

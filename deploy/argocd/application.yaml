# nest-react-boilerplate Argo CD Application
#
# Run `pnpm nrb init` before using this file so the repository, owner, domains,
# release name, and namespace belong to the generated product.
#
#   kubectl apply -f deploy/argocd/application.yaml -n argocd
#
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nest-react-boilerplate
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/your-github-org/nest-react-boilerplate.git
    targetRevision: main
    path: .helm
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
        - values-selection.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nest-react-boilerplate
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10

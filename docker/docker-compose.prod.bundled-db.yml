# Production database overlay: PostgreSQL runs inside this Compose project.
# Use only with docker/docker-compose.prod.yml.

x-postgres-env: &postgres-env
  DATABASE_ENGINE: postgres
  AUTH_PERSISTENCE: postgres
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-nest_react_boilerplate}
  POSTGRES_DB: ${POSTGRES_DB:-nest_react_boilerplate}
  POSTGRES_SSL: ${POSTGRES_SSL:-false}
  POSTGRES_SSL_REJECT_UNAUTHORIZED: ${POSTGRES_SSL_REJECT_UNAUTHORIZED:-true}
  POSTGRES_SYNCHRONIZE: 'false'
  POSTGRES_LOGGING: ${POSTGRES_LOGGING:-false}
  POSTGRES_POOL_MIN: ${POSTGRES_POOL_MIN:-2}
  POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-10}
  POSTGRES_POOL_IDLE_TIMEOUT_MS: ${POSTGRES_POOL_IDLE_TIMEOUT_MS:-30000}
  POSTGRES_SLOW_QUERY_MS: ${POSTGRES_SLOW_QUERY_MS:-}

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '${DOCKER_LOG_MAX_SIZE:-10m}'
        max-file: '${DOCKER_LOG_MAX_FILES:-5}'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nest_react_boilerplate}
      POSTGRES_DB: ${POSTGRES_DB:-nest_react_boilerplate}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    secrets: [postgres_password]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER:-nest_react_boilerplate} -d $${POSTGRES_DB:-nest_react_boilerplate}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    environment: *postgres-env
    secrets: [postgres_password]
    depends_on:
      postgres:
        condition: service_healthy

  admin-app-api:
    environment: *postgres-env
    secrets: [postgres_password]
    depends_on:
      postgres:
        condition: service_healthy

  user-app-api:
    environment: *postgres-env
    secrets: [postgres_password]
    depends_on:
      postgres:
        condition: service_healthy

  auth-app-api:
    environment: *postgres-env
    secrets: [postgres_password]
    depends_on:
      postgres:
        condition: service_healthy

  discord-app-api:
    environment: *postgres-env
    secrets: [postgres_password]
    depends_on:
      postgres:
        condition: service_healthy

  telegram-bot-api:
    environment: *postgres-env
    secrets: [postgres_password]
    depends_on:
      postgres:
        condition: service_healthy

  notification-scheduler:
    environment: *postgres-env
    secrets: [postgres_password]
    depends_on:
      postgres:
        condition: service_healthy

  notification-consumer:
    environment: *postgres-env
    secrets: [postgres_password]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password.txt}

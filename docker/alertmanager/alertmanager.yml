global:
  resolve_timeout: 5m
  smtp_smarthost: ${ALERTMANAGER_SMARTHOST:-localhost:25}
  smtp_from: ${ALERTMANAGER_SMTP_FROM:-alertmanager@example.com}
  smtp_require_tls: false

route:
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 4h

receivers:
  - name: 'default'
    webhook_configs:
      - url: ${ALERTMANAGER_DEFAULT_WEBHOOK_URL:-}
        send_resolved: true

  - name: 'critical-alerts'
    webhook_configs:
      - url: ${ALERTMANAGER_CRITICAL_WEBHOOK_URL:-}
        send_resolved: true

  - name: 'warning-alerts'
    webhook_configs:
      - url: ${ALERTMANAGER_WARNING_WEBHOOK_URL:-}
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'service']

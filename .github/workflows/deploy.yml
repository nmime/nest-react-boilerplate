name: Promote GitOps release

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: 'Full 40-character Git SHA whose release images already exist'
        required: true
        type: string

permissions:
  contents: write
  packages: read
  pull-requests: write

concurrency:
  group: gitops-promotion
  cancel-in-progress: false

env:
  HELM_VERSION: v4.2.3
  SCAN_PREDICATE_TYPE: https://github.com/${{ github.repository }}/attestations/trivy-scan/v1

jobs:
  promote:
    name: Validate images and open promotion PR
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Require the deployment token
        env:
          DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::GH_DEPLOY_TOKEN with repository, pull-request, and package read access is required"
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GH_DEPLOY_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Validate the source revision
        id: revision
        env:
          REQUESTED_SHA: ${{ inputs.git_sha }}
        run: |
          SHA=$(printf '%s' "$REQUESTED_SHA" | tr '[:upper:]' '[:lower:]')
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::git_sha must be a full 40-character hexadecimal Git SHA"
            exit 1
          fi
          git fetch --no-tags origin main
          git cat-file -e "$SHA^{commit}"
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not an ancestor of origin/main"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=release/gitops-sha-$SHA" >> "$GITHUB_OUTPUT"

      - name: Require initialized deployment ownership
        run: |
          if grep -R -n -E 'your-github-org|sha-REPLACE_WITH_RELEASE_GIT_SHA' \
            .helm/values-production.yaml deploy/argocd deploy/flux; then
            echo "::error::Run pnpm nrb init and commit product-owned registry/repository values before promotion"
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Collect candidate release image digests
        id: candidate-images
        env:
          DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
          IMAGE_TAG: ${{ steps.revision.outputs.tag }}
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$DEPLOY_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          certificate_identity_regexp='^https://github.com/${{ github.repository }}/\.github/workflows/release-images\.yml@refs/(heads|tags)/.+$'
          certificate_oidc_issuer='https://token.actions.githubusercontent.com'
          certificate_repository='${{ github.repository }}'
          release_workflow="https://github.com/${{ github.repository }}/.github/workflows/release-images.yml@"
          decode_attestations() {
            local input="$1"
            local output="$2"
            : > "$output"
            while IFS= read -r payload; do
              printf '%s' "$payload" | base64 --decode >> "$output"
              printf '\n' >> "$output"
            done < <(jq -r '.payload' "$input")
          }
          mapfile -t images < <(node scripts/release-image-plan.mjs --names)
          updates=()
          promoted=()
          for image in "${images[@]}"; do
            reference="ghcr.io/${{ github.repository }}/$image:$IMAGE_TAG"
            if ! manifest="$(docker manifest inspect --verbose "$reference" 2>/dev/null)"; then
              echo "Release image not present for this SHA; retaining the currently promoted $image digest"
              continue
            fi
            digest="$(jq -r '.Descriptor.digest // empty' <<< "$manifest")"
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::$reference resolved to an invalid digest: $digest"
              exit 1
            fi
            digest_ref="ghcr.io/${{ github.repository }}/$image@$digest"
            cosign verify \
              --certificate-identity-regexp "$certificate_identity_regexp" \
              --certificate-oidc-issuer "$certificate_oidc_issuer" \
              --certificate-github-workflow-repository "$certificate_repository" \
              --certificate-github-workflow-sha "$RELEASE_SHA" \
              "$digest_ref" >/dev/null

            evidence_dir="$(mktemp -d)"
            cosign verify-attestation --type slsaprovenance1 \
              --certificate-identity-regexp "$certificate_identity_regexp" \
              --certificate-oidc-issuer "$certificate_oidc_issuer" \
              --certificate-github-workflow-repository "$certificate_repository" \
              --certificate-github-workflow-sha "$RELEASE_SHA" \
              "$digest_ref" > "$evidence_dir/provenance.jsonl"
            cosign verify-attestation --type spdxjson \
              --certificate-identity-regexp "$certificate_identity_regexp" \
              --certificate-oidc-issuer "$certificate_oidc_issuer" \
              --certificate-github-workflow-repository "$certificate_repository" \
              --certificate-github-workflow-sha "$RELEASE_SHA" \
              "$digest_ref" > "$evidence_dir/sbom.jsonl"
            cosign verify-attestation --type "$SCAN_PREDICATE_TYPE" \
              --certificate-identity-regexp "$certificate_identity_regexp" \
              --certificate-oidc-issuer "$certificate_oidc_issuer" \
              --certificate-github-workflow-repository "$certificate_repository" \
              --certificate-github-workflow-sha "$RELEASE_SHA" \
              "$digest_ref" > "$evidence_dir/scan.jsonl"
            decode_attestations "$evidence_dir/provenance.jsonl" "$evidence_dir/provenance-statements.jsonl"
            decode_attestations "$evidence_dir/sbom.jsonl" "$evidence_dir/sbom-statements.jsonl"
            decode_attestations "$evidence_dir/scan.jsonl" "$evidence_dir/scan-statements.jsonl"

            jq -s -e \
              --arg digest "${digest#sha256:}" \
              --arg sha "$RELEASE_SHA" \
              --arg workflow "$release_workflow" \
              'any(.[];
                any(.subject[]?; .digest.sha256 == $digest) and
                (.predicate.runDetails.builder.id | startswith($workflow)) and
                any(.predicate.buildDefinition.resolvedDependencies[]?; .digest.gitCommit == $sha)
              )' "$evidence_dir/provenance-statements.jsonl" >/dev/null
            jq -s -e \
              --arg digest "${digest#sha256:}" \
              'any(.[]; any(.subject[]?; .digest.sha256 == $digest) and .predicate.spdxVersion == "SPDX-2.3")' \
              "$evidence_dir/sbom-statements.jsonl" >/dev/null
            jq -s -e \
              --arg digest "$digest" \
              'any(.[];
                .predicate.artifactDigest == $digest and
                .predicate.result == "pass" and
                .predicate.policy.severities == ["CRITICAL", "HIGH"] and
                .predicate.policy.allowUnfixed == false
              )' "$evidence_dir/scan-statements.jsonl" >/dev/null
            rm -rf "$evidence_dir"

            updates+=(--image "$image=$digest")
            promoted+=("$image")
          done
          if [ "${#updates[@]}" -eq 0 ]; then
            echo "::error::No release images were found for $IMAGE_TAG"
            exit 1
          fi
          node scripts/update-deploy-tags.mjs "$RELEASE_SHA" "${updates[@]}"
          (IFS=,; echo "images=${promoted[*]}") >> "$GITHUB_OUTPUT"
          echo "count=${#promoted[@]}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Validate the promoted chart
        run: |
          helm lint .helm -f .helm/values-production.yaml
          helm template nest-react-boilerplate .helm \
            -f .helm/values.yaml \
            -f .helm/values-production.yaml \
            --namespace nest-react-boilerplate >/dev/null
          node scripts/validate-gitops-config.mjs

      - name: Commit the promotion branch
        id: commit
        env:
          BRANCH: ${{ steps.revision.outputs.branch }}
          IMAGE_TAG: ${{ steps.revision.outputs.tag }}
          PROMOTED_IMAGES: ${{ steps.candidate-images.outputs.images }}
        run: |
          if git diff --quiet -- .helm/values-production.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Production values already use the candidate digests for $IMAGE_TAG"
            exit 0
          fi
          git config user.name "nmime"
          git config user.email "66474195+nmime@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add .helm/values-production.yaml
          git commit -m "chore(deploy): promote $IMAGE_TAG (${PROMOTED_IMAGES})"
          git push --force-with-lease origin "HEAD:$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or reuse the promotion PR
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
          BRANCH: ${{ steps.revision.outputs.branch }}
          IMAGE_TAG: ${{ steps.revision.outputs.tag }}
          PROMOTED_IMAGES: ${{ steps.candidate-images.outputs.images }}
        run: |
          PR_URL=$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(deploy): promote $IMAGE_TAG" \
              --body "Promotes signature-verified immutable digests with signed SBOM, SLSA provenance, and successful Trivy scan attestations for \`$PROMOTED_IMAGES\` from \`$IMAGE_TAG\`. Unchanged workloads retain their currently deployed digests. Merge this PR to let Argo CD or Flux reconcile the release.")
          fi
          echo "Promotion PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"

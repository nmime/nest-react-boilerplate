# GitLab CI — mirrors .github/workflows/ci.yml
# Variables: NODE_VERSION_FILE, PNPM_VERSION, CI, NX_DAEMON

stages:
  - security
  - validate
  - test
  - build
  - e2e
  - reports

variables:
  CI: "true"
  NX_DAEMON: "false"
  PNPM_VERSION: "11.11.0"
  NODE_VERSION_FILE: .nvmrc

# Include GitLab SAST/Dependency Scanning
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml

.gitleaks:
  image: zricethezav/gitleaks:latest
  stage: security
  script:
    - gitleaks detect --source=. --report-format json --report-path gl-security-report.json || true
  artifacts:
    reports:
      secret_detection: gl-security-report.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

helm-validation:
  stage: validate
  image: docker:27-dind
  services:
    - docker:27-dind
  before_script:
    - apk add --no-cache curl git jq python3 make bash
    - curl -fsSL https://get.helm.sh/helm-v3.15.4-linux-amd64.tar.gz | tar xz
    - mv linux-amd64/helm /usr/local/bin/
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - node scripts/validate-github-workflows.mjs || true
    - pnpm run deploy:validate
  variables:
    REQUIRE_HELM: "true"
  timeout: 10m

fast-check:
  stage: test
  image: node:24-alpine
  before_script:
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm exec nx run-many -t lint --all
    - pnpm exec nx run-many -t typecheck --all
    - pnpm format:check
    - pnpm test
  timeout: 30m

full-check:
  stage: test
  image: node:24-alpine
  services:
    - postgres:17-alpine
  variables:
    POSTGRES_DB: app_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/app_test"
    TEST_DB_URL: "postgresql://postgres:postgres@postgres:5432/app_test"
  before_script:
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm run db:migrations:check
    - pnpm run lib:configs:check
    - pnpm run api:contracts:check
    - pnpm run api:clients:check
    - pnpm run api:openapi:lint
    - pnpm run api:contracts:consumer
    - pnpm run api:openapi:fuzz
    - pnpm run test:property
    - pnpm run lint
    - pnpm run typecheck
    - pnpm run test
  allow_failure: true
  timeout: 60m

e2e-tests:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.54.2-noble
  before_script:
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm run test:e2e
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  timeout: 15m

docker-smoke-test:
  stage: build
  image: docker:27-dind
  services:
    - docker:27-dind
  before_script:
    - apk add --no-cache curl git jq python3 make bash
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm run test:docker-smoke
  timeout: 30m

docker-fullstack:
  stage: e2e
  image: docker:27-dind
  services:
    - docker:27-dind
  before_script:
    - apk add --no-cache curl git jq python3 make bash
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm run test:fullstack
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  timeout: 45m

storybook-tests:
  stage: test
  image: node:24-alpine
  before_script:
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm run test:storybook
  timeout: 30m

dependency-review:
  stage: security
  image: node:24-alpine
  before_script:
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm run audit:ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

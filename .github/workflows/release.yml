name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency: release
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Only the canonical repository releases. Forks/adopters opt in by setting the
    # `RELEASE_REPOSITORY` Actions variable to their own `owner/repo`; unset keeps
    # the upstream default so this repo's CD is unaffected.
    if: ${{ github.repository == (vars.RELEASE_REPOSITORY || 'nmime/nest-react-boilerplate') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with: { version: 11.15.1 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PROVIDER: github
          # Adopters override the release identity with the RELEASE_GIT_AUTHOR_*
          # Actions variables; unset keeps the upstream default.
          GIT_AUTHOR_NAME: ${{ vars.RELEASE_GIT_AUTHOR_NAME || 'nmime' }}
          GIT_AUTHOR_EMAIL: ${{ vars.RELEASE_GIT_AUTHOR_EMAIL || '66474195+nmime@users.noreply.github.com' }}
          GIT_COMMITTER_NAME: ${{ vars.RELEASE_GIT_AUTHOR_NAME || 'nmime' }}
          GIT_COMMITTER_EMAIL: ${{ vars.RELEASE_GIT_AUTHOR_EMAIL || '66474195+nmime@users.noreply.github.com' }}
      # semantic-release tags its `chore(release) [skip ci]` commit and pushes
      # with GITHUB_TOKEN, so the `push: tags: v*` trigger of release-images is
      # suppressed (both by [skip ci] and by GitHub's token-recursion rule).
      # Dispatch it explicitly on the new tag with a PAT so release images build,
      # scan, and sign automatically. Requires a repo secret RELEASE_DISPATCH_PAT
      # (classic: `repo` + `workflow`, or fine-grained: Actions:write +
      # Contents:read). Without it this is a no-op and images are built by manual
      # dispatch (`gh workflow run release-images.yml --ref <tag>`). The affected-
      # image plan decides what to build (and auto-forces a full build on the first
      # release while values-production.yaml still holds the placeholder tags), so
      # force_full is not passed here — pass `-f force_full=true` only to override.
      - name: Auto-build release images for the new tag
        if: success()
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RELEASE_DISPATCH_PAT not set — skipping automatic release-images build. Build manually: gh workflow run release-images.yml --ref <tag> -f force_full=true"
            exit 0
          fi
          git fetch origin --tags --quiet
          NEW_TAG=$(git tag --points-at HEAD --sort=-v:refname | head -1)
          if [ -z "$NEW_TAG" ]; then
            echo "No new release tag on HEAD; nothing to build."
            exit 0
          fi
          echo "Dispatching release-images for ${NEW_TAG} (affected-image plan)"
          gh workflow run release-images.yml --ref "$NEW_TAG"

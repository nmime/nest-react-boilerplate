# Bitbucket Pipelines — mirrors .github/workflows/ci.yml
image: node:24-alpine

pipelines:
  default:
    - parallel:
      - step:
          name: Gitleaks secret scan
          image: zricethezav/gitleaks:latest
          script:
            - gitleaks detect --source=. --report-format json --report-path gl-secret-report.json || true
          artifacts:
            - gl-secret-report.json

      - step:
          name: Fast check (lint, typecheck, test)
          caches:
            - node
            - pnpm
          script:
            - corepack enable pnpm
            - corepack prepare pnpm@11.11.0 --activate
            - pnpm install --frozen-lockfile
            - pnpm exec nx run-many -t lint --all
            - pnpm exec nx run-many -t typecheck --all
            - pnpm format:check
            - pnpm test
          size: 2x
          timeout: 30

  pull-requests:
    '**':
      - parallel:
      - step:
          name: Dependency audit
          caches:
            - node
            - pnpm
          script:
            - corepack enable pnpm
            - corepack prepare pnpm@11.11.0 --activate
            - pnpm install --frozen-lockfile
            - pnpm run audit:ci

      - step:
          name: E2E tests
          image: mcr.microsoft.com/playwright:v1.54.2-noble
          caches:
            - node
            - pnpm
          script:
            - corepack enable pnpm
            - corepack prepare pnpm@11.11.0 --activate
            - pnpm install --frozen-lockfile
            - pnpm run test:e2e
          size: 2x
          timeout: 15

  branches:
    main:
      - step:
          name: Docker smoke test
          services:
            - docker
          image: docker:27-dind
          caches:
            - node
            - pnpm
          script:
            - corepack enable pnpm
            - corepack prepare pnpm@11.11.0 --activate
            - pnpm install --frozen-lockfile
            - pnpm run test:docker-smoke
          size: 2x
          timeout: 30

definitions:
  caches:
    pnpm: ~/.local/share/pnpm
    node: node_modules

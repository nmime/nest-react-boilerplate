name: Quality presets

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NX_DAEMON: 'false'
  NODE_VERSION_FILE: .nvmrc
  PNPM_VERSION: 11.15.1

jobs:
  visual-regression-matrix:
    name: Storybook visual browser and mobile matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Storybook visual matrix
        run: pnpm run quality:visual
      - name: Upload visual matrix artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: storybook-visual-matrix
          path: |
            playwright-report/storybook-visual/**
            test-results/storybook-visual/**
          if-no-files-found: ignore

  presets:
    name: Modern QA presets
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/nest_react_boilerplate
      ADMIN_BOOTSTRAP_ENABLED: 'true'
      ADMIN_BOOTSTRAP_EMAILS: admin@example.com
      AUTH_TELEGRAM_ENABLED: 'true'
      EXTERNAL_AUTH_AUTO_PROVISION_ENABLED: 'true'
      TELEGRAM_BOT_TOKEN: '123456789:test-bot-token'
      VITE_TELEGRAM_AUTH_ENABLED: 'true'
      # Six browser/device projects share the same runtime client address.
      RATE_LIMIT_MAX: '1000'
      COMPOSE_PROFILES: postgres,redis,nats,admin-app-api,user-app-api,auth-app-api,admin-app,user-app,landing-app,site-app
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8082
      PLAYWRIGHT_AUTO_INSTALL: '1'
      POSTGRES_PORT: '5432'
      ADMIN_APP_API_PORT: '3001'
      USER_APP_API_PORT: '3002'
      AUTH_APP_API_PORT: '3003'
      ADMIN_APP_PORT: '8081'
      USER_APP_PORT: '8082'
      LANDING_APP_PORT: '8083'
      SITE_APP_PORT: '8084'
      A11Y_URLS: http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083
      PERF_URLS: http://127.0.0.1:8082,http://127.0.0.1:8083
      PERF_API_URLS: http://127.0.0.1:3001/health,http://127.0.0.1:3002/health,http://127.0.0.1:3003/health
      SECURITY_DAST_URLS: http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083
      QA_LOAD_URLS: http://127.0.0.1:3001/health,http://127.0.0.1:3002/health,http://127.0.0.1:3003/health
      QA_CANARY_URLS: http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083,http://127.0.0.1:3001/health,http://127.0.0.1:3002/health,http://127.0.0.1:3003/health
      QA_CHAOS_URLS: http://127.0.0.1:3002/health
      QA_CHAOS_SERVICE: user-app-api
      QA_USER_JOURNEY_COMMAND: '["pnpm","run","test:e2e:matrix","--","--project","chromium"]'
      QA_CONCURRENCY_COMMAND: '["pnpm","exec","nx","run","@app/backend-postgres-main-notification:component-test","--","src/repositories/notification-concurrency.component-spec.ts","--maxWorkers=1"]'
      QA_OBSERVABILITY_COMMAND: '["pnpm","run","test:otel","--","--maxWorkers=1"]'
      POSTGRES_CLIENT_DOCKER_IMAGE: postgres:17.6-alpine
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser matrix
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Start local runtime stack
        run: docker compose -f docker/docker-compose.yml up -d --build
      - name: Run quality presets
        run: pnpm run quality:presets
      - name: Stop local runtime stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down --remove-orphans --volumes
      - name: Upload test result artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: quality-preset-results
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore

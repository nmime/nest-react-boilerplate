name: Sync ArgoCD

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force sync (ignore differences)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

env:
  ARGOCD_VERSION: v3.4.2

jobs:
  sync:
    name: Sync ArgoCD Application
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Install argocd CLI
        run: |
          curl -fsSLO "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64"
          curl -fsSLO "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/cli_checksums.txt"
          grep 'argocd-linux-amd64$' cli_checksums.txt | sha256sum --check --strict
          install -m 0755 argocd-linux-amd64 /usr/local/bin/argocd

      - name: Sync application
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          SYNC_FLAGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            SYNC_FLAGS="--force"
          fi
          argocd app sync nest-react-boilerplate $SYNC_FLAGS --grpc-web
          argocd app wait nest-react-boilerplate --health --grpc-web --timeout 600

name: Nx computation cache
description: Restore and save trusted Nx task outputs through the GitHub Actions cache service.

inputs:
  scope:
    description: Stable job scope used to avoid concurrent cache-save collisions.
    required: true

runs:
  using: composite
  steps:
    - name: Restore Nx computation cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-${{ inputs.scope }}-${{ github.sha }}
        restore-keys: |
          nx-${{ runner.os }}-${{ inputs.scope }}-

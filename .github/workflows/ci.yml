name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NX_DAEMON: 'false'
  NX_CACHE_DIRECTORY: .nx/cache
  NODE_VERSION_FILE: .nvmrc
  BUN_VERSION_FILE: .bun-version
  PNPM_VERSION: 11.15.1

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm-validation:
    name: Helm render validation (${{ matrix.selection }})
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - selection: provider-free
            setup_args: --replace --app landing-app --non-interactive
          - selection: postgres
            setup_args: --replace --app auth-app-api --capability postgres --non-interactive
          - selection: mongodb
            setup_args: --replace --app auth-app-api --capability mongodb --non-interactive
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate GitHub workflow hardening
        run: node scripts/validate-github-workflows.mjs

      - name: Materialize selected Helm deployment ownership
        run: pnpm nrb setup ${{ matrix.setup_args }}

      - name: Validate selected Helm deployment
        run: pnpm run deploy:validate:helm
        env:
          REQUIRE_HELM: 'true'

  fast-check:
    name: Fast PR gate (ci:pr)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate branch and commit conventions
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -n "$GITHUB_HEAD_REF" ]]; then
            pnpm run git:conventions -- --branch "$GITHUB_HEAD_REF" --range "origin/$GITHUB_BASE_REF..$PR_HEAD_SHA"
          else
            pnpm run git:conventions -- --branch "$GITHUB_REF_NAME" --range "$BEFORE_SHA..HEAD"
          fi

      - name: Restore Nx computation cache
        uses: ./.github/actions/nx-cache
        with:
          scope: fast

      - name: Run fast aggregate
        run: pnpm run ci:pr

      - name: Write fast gate summary
        if: always()
        run: |
          {
            echo "## Fast PR gate"
            echo
            echo "Command: \`pnpm run ci:pr\`"
            echo
            echo "Workflow: ${{ github.workflow }}"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | tee fast-check-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fast gate summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fast-check-summary
          path: fast-check-summary.md
          if-no-files-found: ignore

  spec-evidence:
    name: Exact-SHA specification evidence
    runs-on: ubuntu-22.04
    needs: fast-check
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Nx computation cache
        uses: ./.github/actions/nx-cache
        with:
          scope: spec-evidence

      - name: Verify impacted requirements
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            lane=pr
            base="origin/$BASE_REF"
          else
            lane=main
            base="$BEFORE_SHA"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD^)"
            fi
          fi
          pnpm run spec:verify -- \
            --lane "$lane" \
            --base "$base" \
            --head HEAD \
            --report test-results/spec-evidence/ci.json

      - name: Upload exact-SHA specification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: exact-sha-specification-evidence
          path: test-results/spec-evidence/**
          if-no-files-found: error

  non-runtime-validation:
    name: Non-runtime validation gates
    runs-on: ubuntu-22.04
    needs: fast-check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Nx computation cache
        uses: ./.github/actions/nx-cache
        with:
          scope: non-runtime

      - name: Verify fresh onboarding and application scaffolds
        run: pnpm run onboarding:verify

      - name: Check migration freshness
        run: pnpm run db:migrations:check

      - name: Check library configuration standards
        run: pnpm run lib:configs:check

      - name: Check generated OpenAPI contracts
        run: pnpm run api:contracts:check

      - name: Check generated API clients
        run: pnpm run api:clients:check

      - name: Lint OpenAPI contracts
        run: pnpm run api:openapi:lint

      - name: Run consumer contract checks
        run: pnpm run api:contracts:consumer

      - name: Run bounded OpenAPI fuzz case generation
        run: pnpm run api:openapi:fuzz

      - name: Run property-based invariant checks
        run: pnpm run test:property

      - name: Write non-runtime validation summary
        if: always()
        run: |
          {
            echo "## Non-runtime validation gates"
            echo
            echo "Commands:"
            echo "- pnpm run onboarding:verify"
            echo "- pnpm run db:migrations:check"
            echo "- pnpm run lib:configs:check"
            echo "- pnpm run api:contracts:check"
            echo "- pnpm run api:clients:check"
            echo "- pnpm run api:openapi:lint"
            echo "- pnpm run api:contracts:consumer"
            echo "- pnpm run api:openapi:fuzz"
            echo "- pnpm run test:property"
            echo
            echo "Workflow: ${{ github.workflow }}"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | tee non-runtime-validation-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-runtime validation summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: non-runtime-validation-summary
          path: non-runtime-validation-summary.md
          if-no-files-found: ignore

  bun-compat:
    name: Bun compatibility contract (${{ matrix.closure }})
    runs-on: ubuntu-22.04
    needs: fast-check
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - closure: provider-free
            setup_args: --replace --app landing-app --non-interactive
          - closure: standalone-site
            setup_args: --replace --app site-app --non-interactive
          - closure: standalone-user-frontend
            setup_args: --replace --app user-app --capability postgres --non-interactive
          - closure: standalone-admin-frontend
            setup_args: --replace --app admin-app --capability postgres --non-interactive
          - closure: standalone-mobile
            setup_args: --replace --app mobile-app --capability postgres --non-interactive
          - closure: standalone-user-api
            setup_args: --replace --app user-app-api --capability postgres --non-interactive
          - closure: standalone-admin-api
            setup_args: --replace --app admin-app-api --capability postgres --non-interactive
          - closure: standalone-discord-api
            setup_args: --replace --app discord-app-api --capability postgres --non-interactive
          - closure: standalone-telegram-api
            setup_args: --replace --app telegram-bot-api --capability postgres --non-interactive
          - closure: preset-minimal
            setup_args: --preset minimal --non-interactive
          - closure: preset-web
            setup_args: --preset web --non-interactive
          - closure: preset-fullstack
            setup_args: --preset fullstack --non-interactive
          - closure: preset-enterprise
            setup_args: --preset enterprise --non-interactive
          - closure: preset-bots
            setup_args: --preset bots --non-interactive
          - closure: mongodb-core
            setup_args: --replace --app auth-app-api --app user-app-api --capability mongodb --non-interactive
          - closure: mongodb-bots
            setup_args: --replace --app auth-app-api --app user-app-api --app discord-app-api --app telegram-bot-api --capability mongodb --non-interactive
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ env.BUN_VERSION_FILE }}

      - name: Install explicit bootstrap/tooling dependencies
        run: pnpm run tooling:install

      - name: Materialize selected runtime closure
        run: |
          pnpm nrb setup ${{ matrix.setup_args }}
          pnpm nrb closure install

      - name: Restore Nx computation cache
        uses: ./.github/actions/nx-cache
        with:
          scope: bun-${{ matrix.closure }}

      - name: Run Bun compatibility contract
        run: pnpm run bun:check

  quality:
    name: Nx quality gates
    runs-on: ubuntu-22.04
    needs:
      - fast-check
      - spec-evidence
      - non-runtime-validation
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Nx computation cache
        uses: ./.github/actions/nx-cache
        with:
          scope: quality

      - name: Changed-file format check
        run: pnpm run format:changed
      - name: Full format check
        run: pnpm run format:check

      - name: Lint, typecheck, test, build (affected on PRs)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Tests run once, with coverage, in the "Enforce coverage thresholds"
          # step below. Running a plain `test` here too would re-execute the same
          # projects under a different Nx hash (coverage changes the task inputs).
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pnpm exec nx affected -t lint typecheck build \
              --base="origin/$BASE_REF" --head=HEAD
          else
            pnpm run lint:all
            pnpm run typecheck:all
            pnpm run build:all
          fi

      - name: Enforce coverage thresholds
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pnpm exec nx affected -t test \
              --base="origin/$BASE_REF" --head=HEAD -- --coverage
          else
            pnpm run test:coverage:all
          fi

      - name: Component tests (Testcontainers)
        run: pnpm exec nx run @app/backend-feature-auth-test:component-test

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-quality
          path: |
            coverage/**
          if-no-files-found: ignore

  e2e:
    name: Static/browser e2e coverage
    runs-on: ubuntu-22.04
    needs: quality
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Nx computation cache
        uses: ./.github/actions/nx-cache
        with:
          scope: e2e

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E coverage
        run: pnpm run test:e2e:coverage:all

      - name: Upload e2e artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-artifacts
          path: |
            coverage/e2e/**
            playwright-report/**
            test-results/**
          if-no-files-found: ignore

  mongodb-validation:
    name: MongoDB migrations, transactions, and adapters
    runs-on: ubuntu-22.04
    needs: fast-check
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Nx computation cache
        uses: ./.github/actions/nx-cache
        with:
          scope: mongodb

      - name: Verify MongoDB migration ledger
        run: node --test --import jiti/register packages/tooling/src/commands/db/mongo-migrate.component.test.ts

      - name: Verify MongoDB transaction and adapter semantics
        run: >-
          pnpm exec nx run-many -t component-test
          --projects=@app/backend-mongodb-main,@app/backend-mongodb-main-auth,@app/backend-mongodb-main-feature-flags,@app/backend-mongodb-main-notification
          --parallel=1

      - name: Verify auth, feature-flag, and notification provider wiring
        run: >-
          pnpm exec nx run-many -t test
          --projects=@app/backend-feature-auth-main,@app/backend-feature-admin-main,@app/backend-feature-notification-main

  visual-regression:
    name: Storybook interaction and visual regression
    runs-on: ubuntu-22.04
    needs: quality
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Nx computation cache
        uses: ./.github/actions/nx-cache
        with:
          scope: visual

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Storybook
        run: pnpm run storybook:build

      - name: Run Storybook interaction tests
        run: pnpm run test:storybook

      - name: Check reviewed visual baselines
        run: pnpm run test:visual

      - name: Upload visual regression artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: storybook-visual-regression
          path: |
            playwright-report/storybook-visual/**
            test-results/storybook-visual/**
          if-no-files-found: ignore

  docker-smoke:
    name: Docker smoke stack
    runs-on: ubuntu-22.04
    needs: quality
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize explicit provider reference build contexts
        run: |
          pnpm nrb closure materialize --all-reference --provider postgres
          pnpm nrb closure materialize --all-reference --provider mongodb

      - name: Docker smoke
        env:
          NRB_CLOSURE_CONTEXT: ${{ github.workspace }}/.nrb/reference/postgres
        run: pnpm run test:docker-smoke

      - name: Production Compose database modes
        run: pnpm run test:compose-deployment-modes

  security-native:
    name: Native security gates
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scanning
        run: pnpm run test:security:secrets

      - name: Static application security testing
        run: pnpm run test:security:sast

      - name: Upload native security artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-security-results
          path: |
            test-results/security-secrets/**
            test-results/security-sast/**
          if-no-files-found: ignore

  ops-gates:
    name: Runtime QA/ops gates
    runs-on: ubuntu-22.04
    needs: docker-smoke
    timeout-minutes: 90
    env:
      DATABASE_ENGINE: postgres
      AUTH_PERSISTENCE: postgres
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/nest_react_boilerplate
      ADMIN_BOOTSTRAP_ENABLED: 'true'
      ADMIN_BOOTSTRAP_EMAILS: admin@example.com
      # The cross-browser matrix includes the real Telegram TMA auth journey.
      # Keep its explicitly fake signing token aligned with the fullstack fixture.
      AUTH_TELEGRAM_ENABLED: 'true'
      EXTERNAL_AUTH_AUTO_PROVISION_ENABLED: 'true'
      TELEGRAM_BOT_TOKEN: '123456789:test-bot-token'
      VITE_TELEGRAM_AUTH_ENABLED: 'true'
      # Six browser/device projects share the same runtime client address.
      RATE_LIMIT_MAX: '1000'
      COMPOSE_PROFILES: postgres,redis,nats,admin-app-api,user-app-api,auth-app-api,admin-app,user-app,landing-app,site-app
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8082
      PLAYWRIGHT_AUTO_INSTALL: '1'
      POSTGRES_PORT: '5432'
      ADMIN_APP_API_PORT: '3001'
      USER_APP_API_PORT: '3002'
      AUTH_APP_API_PORT: '3003'
      ADMIN_APP_PORT: '8081'
      USER_APP_PORT: '8082'
      LANDING_APP_PORT: '8083'
      SITE_APP_PORT: '8084'
      A11Y_URLS: http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083
      PERF_URLS: http://127.0.0.1:8082,http://127.0.0.1:8083
      PERF_API_URLS: http://127.0.0.1:3001/health,http://127.0.0.1:3002/health,http://127.0.0.1:3003/health
      SECURITY_DAST_URLS: http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083
      QA_LOAD_URLS: http://127.0.0.1:3001/health,http://127.0.0.1:3002/health,http://127.0.0.1:3003/health
      QA_CANARY_URLS: http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083,http://127.0.0.1:3001/health,http://127.0.0.1:3002/health,http://127.0.0.1:3003/health
      QA_CHAOS_URLS: http://127.0.0.1:3002/health
      QA_CHAOS_SERVICE: user-app-api
      QA_USER_JOURNEY_COMMAND: '["pnpm","run","test:e2e:matrix","--","--project","chromium"]'
      QA_CONCURRENCY_COMMAND: '["pnpm","exec","nx","run","@app/backend-postgres-main-notification:component-test","--","src/repositories/notification-concurrency.component-spec.ts","--maxWorkers=1"]'
      QA_OBSERVABILITY_COMMAND: '["pnpm","run","test:otel","--","--maxWorkers=1"]'
      QA_MIGRATION_ROLLBACK_COMMAND: '["pnpm","run","db:migrations:rollback-check"]'
      POSTGRES_CLIENT_DOCKER_IMAGE: postgres:17.6-alpine
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser matrix
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Materialize explicit PostgreSQL reference build context
        run: pnpm nrb closure materialize --all-reference --provider postgres

      - name: Start local runtime stack
        run: |
          for attempt in 1 2 3; do
            if docker compose -f docker/docker-compose.yml up -d --build; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Runtime stack failed to start after $attempt attempts" >&2
              exit 1
            fi

            echo "::warning::Runtime stack build attempt $attempt failed; retrying after a transient backoff"
            sleep "$((attempt * 15))"
          done
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/nest_react_boilerplate
          NRB_CLOSURE_CONTEXT: ${{ github.workspace }}/.nrb/reference/postgres

      - name: Run runtime-backed QA/ops gates
        run: pnpm run test:world-class

      - name: Stop local runtime stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down --remove-orphans --volumes
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/nest_react_boilerplate
          NRB_CLOSURE_CONTEXT: ${{ github.workspace }}/.nrb/reference/postgres

      - name: Upload ops gate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ops-gate-artifacts
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore

  fullstack-e2e:
    name: Fullstack Playwright e2e (${{ matrix.database }})
    runs-on: ubuntu-22.04
    needs: docker-smoke
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: postgres
            setup_args: --replace --app fullstack-e2e --capability postgres --non-interactive
          - database: mongodb
            setup_args: --replace --app fullstack-e2e --capability mongodb --non-interactive

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install explicit bootstrap/tooling dependencies
        run: pnpm run tooling:install

      - name: Materialize clean selected fullstack closure
        run: |
          pnpm nrb setup ${{ matrix.setup_args }}
          pnpm nrb closure install

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Fullstack e2e
        run: pnpm run test:fullstack

      - name: Upload fullstack artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fullstack-e2e-${{ matrix.database }}-artifacts
          path: |
            coverage/e2e/fullstack/**
            apps/e2e/fullstack/coverage/e2e/fullstack/**
            playwright-report/fullstack/**
            apps/e2e/fullstack/playwright-report/fullstack/**
            test-results/fullstack/**
            apps/e2e/fullstack/test-results/fullstack/**
          if-no-files-found: ignore

  ci-status-summary:
    name: CI status summary
    runs-on: ubuntu-22.04
    needs:
      - helm-validation
      - fast-check
      - spec-evidence
      - non-runtime-validation
      - bun-compat
      - quality
      - mongodb-validation
      - e2e
      - visual-regression
      - docker-smoke
      - security-native
      - ops-gates
      - fullstack-e2e
    if: always()
    timeout-minutes: 5
    steps:
      - name: Write CI status summary
        run: |
          {
            echo "## CI status summary"
            echo
            echo "Workflow: ${{ github.workflow }}"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Helm render validation | ${{ needs.helm-validation.result }} |"
            echo "| Fast PR gate (ci:pr) | ${{ needs.fast-check.result }} |"
            echo "| Exact-SHA specification evidence | ${{ needs.spec-evidence.result }} |"
            echo "| Non-runtime validation gates | ${{ needs.non-runtime-validation.result }} |"
            echo "| Bun compatibility contract | ${{ needs.bun-compat.result }} |"
            echo "| Nx quality gates | ${{ needs.quality.result }} |"
            echo "| MongoDB migrations, transactions, and adapters | ${{ needs.mongodb-validation.result }} |"
            echo "| Static/browser e2e coverage | ${{ needs.e2e.result }} |"
            echo "| Storybook interaction and visual regression | ${{ needs.visual-regression.result }} |"
            echo "| Docker smoke stack | ${{ needs.docker-smoke.result }} |"
            echo "| Native security gates | ${{ needs.security-native.result }} |"
            echo "| Runtime QA/ops gates | ${{ needs.ops-gates.result }} |"
            echo "| Fullstack Playwright e2e | ${{ needs.fullstack-e2e.result }} |"
          } | tee ci-status-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI status summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ci-status-summary
          path: ci-status-summary.md
          if-no-files-found: error

      - name: Enforce every required CI result
        env:
          REQUIRED_RESULTS: >-
            ${{ needs.helm-validation.result }}
            ${{ needs.fast-check.result }}
            ${{ needs.spec-evidence.result }}
            ${{ needs.non-runtime-validation.result }}
            ${{ needs.bun-compat.result }}
            ${{ needs.quality.result }}
            ${{ needs.mongodb-validation.result }}
            ${{ needs.e2e.result }}
            ${{ needs.visual-regression.result }}
            ${{ needs.docker-smoke.result }}
            ${{ needs.security-native.result }}
            ${{ needs.ops-gates.result }}
            ${{ needs.fullstack-e2e.result }}
        run: |
          for result in $REQUIRED_RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job finished with result: $result"
              exit 1
            fi
          done

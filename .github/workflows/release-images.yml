name: Release images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Optional full SHA of the last deployed/released baseline'
        required: false
        type: string
      force_full:
        description: 'Build every release image instead of using the affected-image plan'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  PNPM_VERSION: 11.11.0
  HELM_VERSION: v4.2.3

jobs:
  helm-render:
    name: Helm render gate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate deployment config
        run: node scripts/validate-deployment-config.mjs
      - name: Validate Helm rate-limit config
        run: node scripts/validate-helm-rate-limit-config.mjs
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Validate Helm chart
        run: bash scripts/validate-helm.sh

  image-plan:
    name: Select affected release images
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      base: ${{ steps.plan.outputs.base }}
      has_images: ${{ steps.plan.outputs.has_images }}
      reason: ${{ steps.plan.outputs.reason }}
      selected_images: ${{ steps.plan.outputs.selected_images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependency metadata for Nx impact analysis
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify Docker dependency manifests
        run: pnpm run docker:manifests:check

      - name: Build the affected-image plan
        id: plan
        env:
          INPUT_BASE_SHA: ${{ inputs.base_sha || '' }}
          INPUT_FORCE_FULL: ${{ inputs.force_full || false }}
        run: |
          args=(--head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT")
          if [ -n "$INPUT_BASE_SHA" ]; then args+=(--base "$INPUT_BASE_SHA"); fi
          if [ "$INPUT_FORCE_FULL" = 'true' ]; then args+=(--force-full); fi
          node scripts/release-image-plan.mjs "${args[@]}"

      - name: Write image-plan summary
        env:
          BASE: ${{ steps.plan.outputs.base }}
          REASON: ${{ steps.plan.outputs.reason }}
          SELECTED_IMAGES: ${{ steps.plan.outputs.selected_images }}
        run: |
          {
            echo '## Release image plan'
            echo
            echo "- Baseline: ${BASE:-none (full release)}"
            echo "- Reason: $REASON"
            echo "- Images: ${SELECTED_IMAGES:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

  workspace-cache:
    name: Prime shared Docker workspace cache
    runs-on: ubuntu-22.04
    needs: image-plan
    if: needs.image-plan.outputs.has_images == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Export shared dependency cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: workspace
          outputs: type=cacheonly
          cache-from: type=gha,scope=release-workspace
          cache-to: type=gha,mode=max,scope=release-workspace

  build-scan-sign:
    name: Build, scan, and sign affected images
    runs-on: ubuntu-22.04
    needs: [helm-render, image-plan, workspace-cache]
    if: needs.image-plan.outputs.has_images == 'true'
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
      attestations: write
    env:
      SELECTED_IMAGES: ${{ needs.image-plan.outputs.selected_images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate the affected bake file
        run: node scripts/generate-bake-file.mjs --only "${SELECTED_IMAGES}"

      - name: Build, push, and attest affected images
        id: bake
        env:
          VITE_TELEGRAM_AUTH_ENABLED: ${{ vars.VITE_TELEGRAM_AUTH_ENABLED || 'false' }}
        run: |
          IFS=',' read -ra NAMES <<< "${SELECTED_IMAGES}"
          set_args=()
          for name in "${NAMES[@]}"; do
            set_args+=(--set "${name}.tags=${IMAGE_PREFIX}/${name}:sha-${GITHUB_SHA}")
          done
          docker buildx bake -f docker-bake.json "${NAMES[@]}" "${set_args[@]}" \
            --set "*.args.VITE_TELEGRAM_AUTH_ENABLED=${VITE_TELEGRAM_AUTH_ENABLED}" \
            --set "*.cache-from=type=gha,scope=release-workspace" \
            --set "*.cache-from=type=gha,scope=release-bake" \
            --set "*.cache-to=type=gha,mode=max,scope=release-bake" \
            --set "*.attest=type=provenance,mode=max" \
            --set "*.attest=type=sbom" \
            --set "*.labels.org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --set "*.labels.org.opencontainers.image.revision=${GITHUB_SHA}" \
            --set "*.labels.org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --push --metadata-file bake-metadata.json

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Install trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: SBOM, scan, and sign each pushed digest
        run: |
          mkdir -p sboms sarifs
          IFS=',' read -ra NAMES <<< "${SELECTED_IMAGES}"
          scan_failed=0
          for name in "${NAMES[@]}"; do
            digest=$(jq -r --arg t "$name" '.[$t]."containerimage.digest"' bake-metadata.json)
            ref="${IMAGE_PREFIX}/${name}@${digest}"
            syft "$ref" -o "spdx-json=sboms/sbom-${name}.spdx.json"
            if trivy image --format sarif --output "sarifs/trivy-${name}.sarif" \
              --pkg-types os,library --severity CRITICAL,HIGH --exit-code 1 "$ref"; then
              cosign sign --yes "$ref"
            else
              scan_failed=1
            fi
            # Stamp a distinct CodeQL category per image (via automationDetails.id)
            # so the combined directory upload is not rejected for multiple runs
            # sharing one category.
            if [ -f "sarifs/trivy-${name}.sarif" ]; then
              tmp=$(mktemp)
              jq --arg cat "trivy-${name}/" '.runs[].automationDetails.id = $cat' \
                "sarifs/trivy-${name}.sarif" > "$tmp" && mv "$tmp" "sarifs/trivy-${name}.sarif"
            fi
          done
          echo "scan_failed=${scan_failed}" >> "$GITHUB_ENV"

      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: sboms/
          if-no-files-found: error

      - name: Upload Trivy SARIFs
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: sarifs

      - name: Fail the job if any image had a CRITICAL/HIGH finding
        if: always()
        run: test "${scan_failed:-0}" = 0

        file: libs/common/config/lib/src/create-config.spec.ts
        target: '@app/common-config:test'
        lanes:
          - pr
          - main
      - kind: security
        file: libs/common/config/lib/src/create-config.spec.ts
        target: '@app/common-config:test'
        lanes:
          - pr
          - main

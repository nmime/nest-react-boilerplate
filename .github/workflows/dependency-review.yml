name: Dependency review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-audit:
    name: Supported lockfile audit
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      CI: 'true'
      NODE_VERSION_FILE: .nvmrc
      PNPM_VERSION: 11.15.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production lockfile
        run: pnpm run audit:ci

      - name: Write lockfile audit summary
        if: always()
        run: |
          {
            echo "## Dependency review summary"
            echo
            echo "Workflow: ${{ github.workflow }}"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "GitHub dependency-review-action is intentionally not used because this repository does not support GitHub Dependency Graph for that action."
            echo "This workflow uses the supported lockfile fallback: \`pnpm run audit:ci\` (production dependencies, moderate severity threshold)."
          } | tee dependency-review-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload dependency review summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-review-summary
          path: dependency-review-summary.md
          if-no-files-found: ignore

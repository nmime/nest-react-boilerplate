name: Runtime specification assurance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-specification-assurance-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  NX_DAEMON: 'false'
  NODE_VERSION_FILE: .nvmrc
  PNPM_VERSION: 11.15.1

jobs:
  assurance:
    name: Runtime exact-SHA evidence
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Execute all runtime requirement evidence
        run: pnpm run spec:verify -- --all --lane runtime --report test-results/spec-evidence/runtime.json

      - name: Upload runtime assurance dossier
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: runtime-specification-assurance
          path: |
            test-results/**
            playwright-report/**
            coverage/e2e/**
          if-no-files-found: error

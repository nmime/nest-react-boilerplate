  'better-auth': '1.6.23'
  'drizzle-orm': '0.45.2'
  'find-my-way': '9.7.0'
  'kysely': '0.28.17'
  'typescript': '6.0.3'
  '@types/node': '24.13.3'
  '@expo/dom-webview': '57.0.1'
  'rxjs': '7.8.2'
  'tslib': '2.8.1'
  '@nestjs/common': '11.1.28'
  '@nestjs/core': '11.1.28'
  '@nestjs/platform-fastify': '11.1.28'
  '@nestjs/platform-express': '11.1.28'
  '@nestjs/testing': '11.1.28'
  'lodash': '4.18.1'
  'brace-expansion': '5.0.8'
  'picomatch@<3.0.0': '2.3.2'
  'picomatch@>=4.0.0 <5.0.0': '4.0.4'
  'path-to-regexp@>=8.0.0 <9.0.0': '8.4.2'
  'serialize-javascript': '7.0.5'
  'postcss': '8.5.21'
  'follow-redirects': '1.16.0'
  'axios': '1.18.0'
  'fast-uri': '3.1.4'
  'svgo@>=3.0.0 <4.0.0': '3.3.4'
  'js-yaml@<4.0.0': '3.15.0'
  'js-yaml@>=4.0.0 <5.0.0': '4.3.0'
  'js-yaml@>=5.0.0 <6.0.0': '5.2.2'
  'yaml': '2.9.0'
  'ajv@>=7.0.0 <9.0.0': '8.20.0'
  'ws': '8.21.0'
  'tmp@<0.2.7': '0.2.7'
  'uuid@<11.1.1': '11.1.1'
  'qs@>=6.11.1 <=6.15.1': '6.15.2'
  'undici@<7.28.0': '7.28.0'
  'undici@>=8.0.0 <8.5.0': '8.5.0'
  'happy-dom@>=15.10.0 <20.10.6': '20.10.6'
  'esbuild@<=0.24.2': '0.25.0'
  'form-data@<4.0.6': '4.0.6'
  'http-proxy-middleware@>=3.0.0 <3.0.7': '3.0.7'
  '@opentelemetry/core@<2.8.0': '2.8.0'
  'multer@>=2.0.0-alpha.1 <2.2.0': '2.2.0'
  'webpack-dev-server@<5.2.5': '5.2.5'
  'http-proxy-middleware@>=2.0.0 <2.0.10': '2.0.10'
  # The pinned shadcn CLI brings an MCP SDK range that still resolves the
  # vulnerable v1 Node adapter. Keep its dev-tool dependency on a mature
  # patched adapter while the SDK range catches up.
  '@hono/node-server': '2.0.10'

peerDependencyRules:
  allowedVersions:
    # Nest's Fastify adapter declares this optional peer for its static adapter,
    # which the APIs do not use. Swagger and the site support the patched 10.x API.
    '@fastify/static': '10.1.2'

# react-native-worklets 0.10.0 imports these Babel packages from its compiled
# plugin without declaring them. Keep the fix scoped to that exact release so
# pnpm's isolated linker produces a reproducible mobile export.
packageExtensions:
  'react-native-worklets@0.10.0':
    dependencies:
      '@babel/generator': '7.29.7'
      '@babel/traverse': '7.29.7'
  # @tamagui/popper imports react-dom directly but exposes it only as a
  # transitive peer through internal packages. Declare the real edge so pnpm's
  # isolated linker and Bun resolve the same mobile dependency tree.
  '@tamagui/popper@2.5.0':
    dependencies:
      'react-dom': '19.2.3'
  '@tamagui/floating@2.5.0':
    dependencies:
      'react-dom': '19.2.3'

# Escape hatch for the hard audit:ci gate: when an advisory has no upstream
# fix, list the CVE id here with a tracking issue instead of unblocking ad hoc.
auditConfig:
  ignoreCves: []

# Supply-chain quarantine: reject versions published less than a day ago.
# Raise toward 10080 (7 days) once the dependency set stops churning weekly;
# 10080 currently rejects ~208 recently-published entries in this lockfile.
minimumReleaseAge: 1440

# Keep dependency reconciliation explicit. pnpm 11.11 otherwise attempts an
# implicit install before every script, which makes local and CI runs mutate
# node_modules instead of failing with an actionable install instruction.
verifyDepsBeforeRun: false


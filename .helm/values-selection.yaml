      service: admin-app-api
      paths: ['/']
    - host: auth-app-api.example.com
      service: auth-app-api
      paths: ['/']
    - host: example.com
      service: landing-app
      paths: ['/']
    - host: mobile-app.example.com
      service: mobile-app
      paths: ['/']
    - host: site-app.example.com
      service: site-app
      paths: ['/']
    - host: user-app.example.com
      service: user-app
      paths: ['/']
    - host: user-app-api.example.com
      service: user-app-api
      paths: ['/']
  tls: []
apps:
  adminApp:
    enabled: true
  userApp:
    enabled: true
  landingApp:
    enabled: true
  siteApp:
    enabled: true
  mobileApp:
    enabled: true
  adminAppApi:
    enabled: true
  userAppApi:
    enabled: true
  authAppApi:

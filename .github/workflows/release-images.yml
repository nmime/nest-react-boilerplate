name: Release images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Optional full SHA of the last deployed/released baseline'
        required: false
        type: string
      force_full:
        description: 'Build every setup-selected release image instead of using the affected-image plan'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  PNPM_VERSION: 11.15.1
  HELM_VERSION: v4.2.3
  SCAN_PREDICATE_TYPE: https://github.com/${{ github.repository }}/attestations/trivy-scan/v1

jobs:
  image-plan:
    name: Select affected release images
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      base: ${{ steps.plan.outputs.base }}
      has_images: ${{ steps.plan.outputs.has_images }}
      reason: ${{ steps.plan.outputs.reason }}
      selected_images: ${{ steps.plan.outputs.selected_images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install explicit bootstrap/tooling dependencies
        run: pnpm run tooling:install

      - name: Install clean product-selected closure
        run: pnpm nrb closure install

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Validate selected Helm deployment
        run: pnpm run deploy:validate:helm

      - name: Build the affected-image plan
        id: plan
        env:
          INPUT_BASE_SHA: ${{ inputs.base_sha || '' }}
          INPUT_FORCE_FULL: ${{ inputs.force_full || false }}
        run: |
          args=(--head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT")
          if [ -n "$INPUT_BASE_SHA" ]; then args+=(--base "$INPUT_BASE_SHA"); fi
          if [ "$INPUT_FORCE_FULL" = 'true' ] || [[ "$GITHUB_REF" == refs/tags/* ]]; then args+=(--force-full); fi
          node scripts/release-image-plan.mjs "${args[@]}"

      - name: Write image-plan summary
        env:
          BASE: ${{ steps.plan.outputs.base }}
          REASON: ${{ steps.plan.outputs.reason }}
          SELECTED_IMAGES: ${{ steps.plan.outputs.selected_images }}
        run: |
          {
            echo '## Release image plan'
            echo
            echo "- Baseline: ${BASE:-none (full release)}"
            echo "- Reason: $REASON"
            echo "- Images: ${SELECTED_IMAGES:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

  build-scan-sign:
    name: Build, scan, and sign selected images
    runs-on: ubuntu-22.04
    needs: image-plan
    if: needs.image-plan.outputs.has_images == 'true'
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
      attestations: write
    env:
      SELECTED_IMAGES: ${{ needs.image-plan.outputs.selected_images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install explicit bootstrap/tooling dependencies
        run: pnpm run tooling:install

      - name: Install clean product-selected closure
        run: pnpm nrb closure install

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate the selected bake file
        run: node scripts/generate-bake-file.mjs --only "${SELECTED_IMAGES}"

      - name: Build, push, and attest selected images
        id: bake
        env:
          VITE_TELEGRAM_AUTH_ENABLED: ${{ vars.VITE_TELEGRAM_AUTH_ENABLED || 'false' }}
        run: |
          IFS=',' read -ra NAMES <<< "${SELECTED_IMAGES}"
          set_args=()
          for name in "${NAMES[@]}"; do
            set_args+=(--set "${name}.tags=${IMAGE_PREFIX}/${name}:sha-${GITHUB_SHA}")
          done
          docker buildx bake -f docker-bake.json "${NAMES[@]}" "${set_args[@]}" \
            --set "*.args.VITE_TELEGRAM_AUTH_ENABLED=${VITE_TELEGRAM_AUTH_ENABLED}" \
            --set "*.cache-from=type=gha,scope=release-bake-v2" \
            --set "*.cache-to=type=gha,mode=max,scope=release-bake-v2" \
            --set "*.attest=type=provenance,mode=max" \
            --set "*.attest=type=sbom" \
            --set "*.labels.org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --set "*.labels.org.opencontainers.image.revision=${GITHUB_SHA}" \
            --set "*.labels.org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --push --metadata-file bake-metadata.json

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Install trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: SBOM, scan, and sign each pushed digest
        run: |
          mkdir -p attestations sboms sarifs
          IFS=',' read -ra NAMES <<< "${SELECTED_IMAGES}"
          scan_failed=0
          for name in "${NAMES[@]}"; do
            digest=$(jq -r --arg t "$name" '.[$t]."containerimage.digest"' bake-metadata.json)
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::build metadata returned an invalid digest for ${name}: ${digest}"
              exit 1
            fi
            ref="${IMAGE_PREFIX}/${name}@${digest}"
            syft "$ref" -o "spdx-json=sboms/sbom-${name}.spdx.json"
            if trivy image --format sarif --output "sarifs/trivy-${name}.sarif" \
              --pkg-types os,library --severity CRITICAL,HIGH --exit-code 1 "$ref"; then
              echo "::notice::scan PASS ${name}"
              jq -n \
                --arg builder "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
                --arg invocation "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
                --arg ref "$GITHUB_REF" \
                --arg sha "$GITHUB_SHA" \
                --arg source "git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
                '{
                  buildDefinition: {
                    buildType: "https://github.com/Attestations/GitHubActionsWorkflow@v1",
                    externalParameters: {ref: $ref},
                    internalParameters: {},
                    resolvedDependencies: [{uri: $source, digest: {gitCommit: $sha}}]
                  },
                  runDetails: {
                    builder: {id: $builder},
                    metadata: {invocationId: $invocation}
                  }
                }' > "attestations/provenance-${name}.json"
              jq -n \
                --arg digest "$digest" \
                --arg scanner "pkg:github/aquasecurity/trivy@v0.72.0" \
                '{
                  scanner: {uri: $scanner},
                  artifactDigest: $digest,
                  result: "pass",
                  policy: {severities: ["CRITICAL", "HIGH"], allowUnfixed: false}
                }' > "attestations/scan-${name}.json"
              cosign sign --yes "$ref"
              cosign attest --yes --type spdxjson --predicate "sboms/sbom-${name}.spdx.json" "$ref"
              cosign attest --yes --type slsaprovenance1 --predicate "attestations/provenance-${name}.json" "$ref"
              cosign attest --yes --type "$SCAN_PREDICATE_TYPE" --predicate "attestations/scan-${name}.json" "$ref"
            else
              findings=$(jq '[.runs[].results[]?] | length' "sarifs/trivy-${name}.sarif" 2>/dev/null || echo '?')
              echo "::error::scan FAIL ${name} (${findings} CRITICAL/HIGH findings)"
              scan_failed=1
            fi
            # Stamp a distinct CodeQL category per image (via automationDetails.id)
            # so the combined directory upload is not rejected for multiple runs
            # sharing one category.
            if [ -f "sarifs/trivy-${name}.sarif" ]; then
              tmp=$(mktemp)
              jq --arg cat "trivy-${name}/" '.runs[].automationDetails.id = $cat' \
                "sarifs/trivy-${name}.sarif" > "$tmp" && mv "$tmp" "sarifs/trivy-${name}.sarif"
            fi
          done
          echo "scan_failed=${scan_failed}" >> "$GITHUB_ENV"

      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: sboms/
          if-no-files-found: error

      - name: Upload Trivy SARIFs
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: sarifs

      - name: Fail the job if any image had a CRITICAL/HIGH finding
        if: always()
        run: test "${scan_failed:-0}" = 0

storybook-tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
  before_script:
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm run storybook:build
    - pnpm run test:storybook
    - pnpm run test:visual
  artifacts:
    when: always
    paths:
      - playwright-report/storybook-visual/
      - test-results/storybook-visual/
    expire_in: 7 days
  timeout: 30m

# Runtime-backed lane. Deliberately placed after storybook-tests: the workflow
# validator isolates docker-fullstack-mongodb by reading everything up to
# `storybook-tests:`, and this job legitimately pins COMPOSE_PROFILES.
ops-gates:
  stage: e2e
  image: node:24.18.0-alpine
  needs:
    - docker-smoke-test
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    DATABASE_ENGINE: postgres
    AUTH_PERSISTENCE: postgres
    DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/nest_react_boilerplate
    CONTAINER_DATABASE_URL: postgres://postgres:postgres@postgres:5432/nest_react_boilerplate
    ADMIN_BOOTSTRAP_ENABLED: 'true'
    ADMIN_BOOTSTRAP_EMAILS: admin@example.com
    # The cross-browser matrix includes the real Telegram TMA auth journey.
    # Keep its explicitly fake signing token aligned with the fullstack fixture.
    AUTH_TELEGRAM_ENABLED: 'true'
    EXTERNAL_AUTH_AUTO_PROVISION_ENABLED: 'true'
    TELEGRAM_BOT_TOKEN: '123456789:test-bot-token'
    VITE_TELEGRAM_AUTH_ENABLED: 'true'
    # Deterministic CI-only AES-256 fixture; production loads an external secret.
    NOTIFICATION_PAYLOAD_ENCRYPTION_KEY: 'BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc='
    # Six browser/device projects share the same runtime client address.
    RATE_LIMIT_MAX: '1000'
    COMPOSE_PROFILES: postgres,redis,nats,admin-app-api,user-app-api,auth-app-api,admin-app,user-app,landing-app,site-app
    PLAYWRIGHT_BASE_URL: http://127.0.0.1:8082
    PLAYWRIGHT_AUTO_INSTALL: '1'
    POSTGRES_PORT: '5432'
    ADMIN_APP_API_PORT: '3001'
    USER_APP_API_PORT: '3002'
    AUTH_APP_API_PORT: '3003'
    ADMIN_APP_PORT: '8081'
    USER_APP_PORT: '8082'
    LANDING_APP_PORT: '8083'
    SITE_APP_PORT: '4203'
    NRB_CLOSURE_CONTEXT: '$CI_PROJECT_DIR/.nrb/reference/postgres'
    FRONTEND_RUNTIME_ALLOW_LOOPBACK_HTTP: 'true'
    LANDING_ADMIN_APP_URL: http://127.0.0.1:8081
    LANDING_USER_APP_URL: http://127.0.0.1:8082
    A11Y_URLS: http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083
    PERF_URLS: http://127.0.0.1:8082,http://127.0.0.1:8083
    PERF_API_URLS: http://127.0.0.1:3001/health,http://127.0.0.1:3002/health,http://127.0.0.1:3003/health
    SECURITY_DAST_URLS: http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083
    QA_LOAD_URLS: http://127.0.0.1:3001/health,http://127.0.0.1:3002/health,http://127.0.0.1:3003/health
    QA_CANARY_URLS: http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083,http://127.0.0.1:3001/health,http://127.0.0.1:3002/health,http://127.0.0.1:3003/health
    QA_CHAOS_URLS: http://127.0.0.1:3002/health
    QA_CHAOS_SERVICE: user-app-api
    QA_USER_JOURNEY_COMMAND: '["pnpm","run","test:e2e:matrix","--","--project","chromium"]'
    QA_CONCURRENCY_COMMAND: '["pnpm","exec","nx","run","@app/backend-postgres-main-notification:component-test","--","src/repositories/notification-concurrency.component-spec.ts","--maxWorkers=1"]'
    QA_OBSERVABILITY_COMMAND: '["pnpm","run","test:otel","--","--maxWorkers=1"]'
    QA_MIGRATION_ROLLBACK_COMMAND: '["pnpm","run","db:migrations:rollback-check"]'
    POSTGRES_CLIENT_DOCKER_IMAGE: postgres:17.6-alpine
  before_script:
    - apk add --no-cache bash curl git jq python3 make postgresql-client docker-cli docker-cli-compose
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm exec playwright install --with-deps chromium firefox webkit
    - pnpm nrb closure materialize --all-reference --provider postgres
    # Runs scripts/ci/runtime-stack.mjs, the same driver .github/actions/runtime-stack invokes.
    - bash scripts/ci/runtime-stack.sh
    - pnpm run test:world-class
    # A11Y_URLS is already set for this job and the stack is already up, so the
    # axe scan belongs in the blocking lane rather than a scheduled preset.
    - pnpm run test:a11y
  after_script:
    - docker compose -f docker/docker-compose.yml down --remove-orphans --volumes
  artifacts:
    when: always
    paths:
      - test-results/
      - playwright-report/
    expire_in: 7 days
  timeout: 90m

visual-regression-matrix:
  stage: test
  image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
  before_script:
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm run quality:visual
  artifacts:
    when: always
    paths:
      - playwright-report/storybook-visual/
      - test-results/storybook-visual/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  timeout: 45m

# Scheduled full-inventory evidence. The GitHub twin is
# .github/workflows/spec-assurance-nightly.yml; scripts/ci/gates.json names both
# as the executors of the `nightly` lane so neither can quietly disappear.
spec-evidence-nightly:
  stage: reports
  image: node:24.18.0-alpine
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    NX_PARALLEL: '2'
    VITEST_MAX_WORKERS: '1'
    WORLD_CLASS_COMMAND_TIMEOUT_MS: '1800000'
    DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/nest_react_boilerplate
    CONTAINER_DATABASE_URL: postgres://postgres:postgres@postgres:5432/nest_react_boilerplate
    ADMIN_BOOTSTRAP_ENABLED: 'true'
    ADMIN_BOOTSTRAP_EMAILS: admin@example.com
    AUTH_TELEGRAM_ENABLED: 'true'
    EXTERNAL_AUTH_AUTO_PROVISION_ENABLED: 'true'
    TELEGRAM_BOT_TOKEN: '123456789:test-bot-token'
    VITE_TELEGRAM_AUTH_ENABLED: 'true'
    # Deterministic CI-only AES-256 fixture; production loads an external secret.
    NOTIFICATION_PAYLOAD_ENCRYPTION_KEY: 'BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc='
    RATE_LIMIT_MAX: '1000'
    COMPOSE_PROFILES: postgres,redis,nats,admin-app-api,user-app-api,auth-app-api,admin-app,user-app,landing-app,site-app
    PLAYWRIGHT_BASE_URL: http://127.0.0.1:8082
    PLAYWRIGHT_AUTO_INSTALL: '1'
    POSTGRES_PORT: '5432'
    ADMIN_APP_API_PORT: '3001'
    USER_APP_API_PORT: '3002'
    AUTH_APP_API_PORT: '3003'
    ADMIN_APP_PORT: '8081'
    USER_APP_PORT: '8082'
    LANDING_APP_PORT: '8083'
    SITE_APP_PORT: '4203'
    NRB_CLOSURE_CONTEXT: '$CI_PROJECT_DIR/.nrb/reference/postgres'
    FRONTEND_RUNTIME_ALLOW_LOOPBACK_HTTP: 'true'
    LANDING_ADMIN_APP_URL: http://127.0.0.1:8081
    LANDING_USER_APP_URL: http://127.0.0.1:8082
    A11Y_URLS: http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083
    PERF_URLS: http://127.0.0.1:8082,http://127.0.0.1:8083
    PERF_API_URLS: http://127.0.0.1:3001/health,http://127.0.0.1:3002/health,http://127.0.0.1:3003/health
    SECURITY_DAST_URLS: http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083
    QA_LOAD_URLS: http://127.0.0.1:3001/health,http://127.0.0.1:3002/health,http://127.0.0.1:3003/health
    QA_CANARY_URLS: http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083,http://127.0.0.1:3001/health,http://127.0.0.1:3002/health,http://127.0.0.1:3003/health
    QA_RELIABILITY_URLS: http://127.0.0.1:3001/health,http://127.0.0.1:3002/health,http://127.0.0.1:3003/health
    QA_RELIABILITY_CONCURRENCY: '4'
    QA_CHAOS_URLS: http://127.0.0.1:3002/health
    QA_CHAOS_SERVICE: user-app-api
    QA_USER_JOURNEY_COMMAND: '["pnpm","run","test:e2e:matrix","--","--project","chromium"]'
    QA_CONCURRENCY_COMMAND: '["pnpm","exec","nx","run","@app/backend-postgres-main-notification:component-test","--","src/repositories/notification-concurrency.component-spec.ts","--maxWorkers=1"]'
    QA_OBSERVABILITY_COMMAND: '["pnpm","run","test:otel","--","--maxWorkers=1"]'
    POSTGRES_CLIENT_DOCKER_IMAGE: postgres:17.6-alpine
  before_script:
    - apk add --no-cache bash curl git jq python3 make postgresql-client docker-cli docker-cli-compose
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm exec playwright install --with-deps chromium firefox webkit
    - pnpm nrb closure materialize --all-reference --provider postgres
    - bash scripts/ci/runtime-stack.sh
    - pnpm run spec:verify -- --all --lane nightly --report test-results/spec-evidence/nightly.json
  after_script:
    - docker compose -f docker/docker-compose.yml down --remove-orphans --volumes
  artifacts:
    when: always
    paths:
      - test-results/
      - coverage/
      - reports/mutation/
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  timeout: 240m

# Evidence that needs a live runtime rather than a build sandbox. Manual, like
# its GitHub twin's workflow_dispatch trigger.
spec-evidence-runtime:
  stage: reports
  image: mcr.microsoft.com/playwright:v1.61.1-noble
  before_script:
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm run spec:verify -- --all --lane runtime --report test-results/spec-evidence/runtime.json
  artifacts:
    when: always
    paths:
      - test-results/
      - playwright-report/
      - coverage/e2e/
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  timeout: 90m

dependency-review:
  stage: security
  image: node:24.18.0-alpine
  before_script:
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm run audit:ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# The single fan-in check a protected-branch rule can require, equivalent to
# GitHub's "CI status summary". GitLab starts a job only once every job in
# `needs:` has succeeded, so this job reaching `success` is itself the proof that
# every merge-required gate passed; naming fifteen jobs in the branch rule
# instead would silently stop covering whatever is added next.
ci-status-summary:
  stage: reports
  image: node:24.18.0-alpine
  needs:
    - job: gitleaks
      optional: true
    - job: helm-validation
    - job: fast-check
    - job: spec-evidence
    - job: non-runtime-validation
    - job: bun-compat
    - job: full-check
    - job: component-tests
    - job: mongodb-validation
      optional: true
    - job: e2e-tests
      optional: true
    - job: storybook-tests
    - job: docker-smoke-test
    - job: ops-gates
    - job: docker-fullstack
      optional: true
    - job: docker-fullstack-mongodb
      optional: true
  script:
    - node scripts/ci/check-pipelines.mjs
    - echo "All merge-required gates in scripts/ci/gates.json reported success."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  timeout: 10m

# Build, scan, sign, and publish the affected release images. This lane did not
# exist on GitLab at all: a product that deleted .github/ shipped unsigned,
# unscanned, unattested images. scripts/ci/gates.json lists every supply-chain
# control this job has to implement, and check-pipelines.mjs fails the pipeline
# if one goes missing here.
release-images:
  stage: release
  image: node:24.18.0-alpine
  services:
    - docker:27.5.1-dind
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    IMAGE_PREFIX: $CI_REGISTRY_IMAGE
    SCAN_PREDICATE_TYPE: $CI_SERVER_URL/$CI_PROJECT_PATH/attestations/trivy-scan/v1
  before_script:
    - apk add --no-cache bash curl git jq tar docker-cli docker-cli-buildx
    - curl -fsSL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin syft
    - curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz" | tar xz -C /usr/local/bin trivy
    - curl -fsSL -o /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
    - chmod +x /usr/local/bin/cosign
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm run tooling:install
    - pnpm nrb closure install
  script:
    # Which images to build comes from the shared plan over the installed product
    # closure, so neither forge carries its own hardcoded image list.
    - node scripts/release-image-plan.mjs --head "$CI_COMMIT_SHA" --force-full --github-output image-plan.env
    - |
      set -eu
      # shellcheck disable=SC1091
      . ./image-plan.env
      if [ "$has_images" != 'true' ]; then
        echo "No release images selected ($reason); nothing to build."
        exit 0
      fi

      echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      # The default docker driver cannot emit attestations; the container driver can.
      docker buildx create --use --driver docker-container --name release-builder

      node scripts/generate-bake-file.mjs --only "$selected_images"

      names=$(echo "$selected_images" | tr ',' ' ')
      set_args=''
      for name in $names; do
        set_args="$set_args --set ${name}.tags=${IMAGE_PREFIX}/${name}:sha-${CI_COMMIT_SHA}"
      done

      # shellcheck disable=SC2086
      docker buildx bake -f docker-bake.json $names $set_args \
        --set "*.args.VITE_TELEGRAM_AUTH_ENABLED=${VITE_TELEGRAM_AUTH_ENABLED:-false}" \
        --set "*.cache-from=type=registry,ref=${IMAGE_PREFIX}/buildcache" \
        --set "*.cache-to=type=registry,mode=max,ref=${IMAGE_PREFIX}/buildcache" \
        --set "*.attest=type=provenance,mode=max" \
        --set "*.attest=type=sbom" \
        --set "*.labels.org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --set "*.labels.org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --set "*.labels.org.opencontainers.image.version=${CI_COMMIT_TAG:-$CI_COMMIT_SHA}" \
        --push --metadata-file bake-metadata.json

      mkdir -p attestations sboms sarifs
      scan_failed=0
      for name in $names; do
        # Every post-build step addresses the digest the build reported, never a
        # tag another pipeline could move underneath it.
        digest=$(jq -r --arg t "$name" '.[$t]."containerimage.digest"' bake-metadata.json)
        if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
          echo "build metadata returned an invalid digest for ${name}: ${digest}" >&2
          exit 1
        fi
        ref="${IMAGE_PREFIX}/${name}@${digest}"
        syft "$ref" -o "spdx-json=sboms/sbom-${name}.spdx.json"
        if trivy image --format sarif --output "sarifs/trivy-${name}.sarif" \
          --pkg-types os,library --severity CRITICAL,HIGH --exit-code 1 "$ref"; then
          echo "scan PASS ${name}"
          jq -n \
            --arg builder "${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID}" \
            --arg invocation "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}" \
            --arg ref "${CI_COMMIT_REF_NAME}" \
            --arg sha "$CI_COMMIT_SHA" \
            --arg source "git+${CI_PROJECT_URL}.git" \
            '{
              buildDefinition: {
                buildType: "https://gitlab.com/attestations/GitLabPipeline@v1",
                externalParameters: {ref: $ref},
                internalParameters: {},
                resolvedDependencies: [{uri: $source, digest: {gitCommit: $sha}}]
              },
              runDetails: {
                builder: {id: $builder},
                metadata: {invocationId: $invocation}
              }
            }' > "attestations/provenance-${name}.json"
          jq -n \
            --arg digest "$digest" \
            --arg scanner "pkg:github/aquasecurity/trivy@${TRIVY_VERSION}" \
            '{
              scanner: {uri: $scanner},
              artifactDigest: $digest,
              result: "pass",
              policy: {severities: ["CRITICAL", "HIGH"], allowUnfixed: false}
            }' > "attestations/scan-${name}.json"
          cosign sign --yes "$ref"
          cosign attest --yes --type spdxjson --predicate "sboms/sbom-${name}.spdx.json" "$ref"
          cosign attest --yes --type slsaprovenance1 --predicate "attestations/provenance-${name}.json" "$ref"
          cosign attest --yes --type "$SCAN_PREDICATE_TYPE" --predicate "attestations/scan-${name}.json" "$ref"
        else
          findings=$(jq '[.runs[].results[]?] | length' "sarifs/trivy-${name}.sarif" 2>/dev/null || echo '?')
          echo "scan FAIL ${name} (${findings} CRITICAL/HIGH findings)" >&2
          scan_failed=1
        fi
      done
      # A CRITICAL/HIGH finding fails the release; it is never downgraded to a warning.
      test "$scan_failed" = 0
  artifacts:
    when: always
    paths:
      - sboms/
      - sarifs/
      - attestations/
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  timeout: 90m

release:
  stage: release
  image: node:24.18.0-alpine
  before_script:
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - |
      set -eu
      test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
      git fetch --no-tags origin "$CI_DEFAULT_BRANCH"
      if [ "$(git rev-parse FETCH_HEAD)" != "$CI_COMMIT_SHA" ]; then
        echo "Refusing stale release: $CI_DEFAULT_BRANCH advanced after this pipeline started" >&2
        exit 1
      fi
      pnpm exec semantic-release
  variables:
    GIT_DEPTH: '0'
    RELEASE_PROVIDER: gitlab
    GIT_AUTHOR_NAME: nmime
    GIT_AUTHOR_EMAIL: 66474195+nmime@users.noreply.github.com
    GIT_COMMITTER_NAME: nmime
    GIT_COMMITTER_EMAIL: 66474195+nmime@users.noreply.github.com
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($GITLAB_TOKEN != null || $GL_TOKEN != null)'

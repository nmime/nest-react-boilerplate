# nest-react-boilerplate ArgoCD Application
#
# Deploy to any cluster with ArgoCD installed:
#
#   kubectl apply -f deploy/argocd/application.yaml -n argocd
#
# ansible-k8s-full-setup provisions ArgoCD with open source repos enabled
# (sourceRepos defaults to ["*"]). No ansible-k8s-specific config needed.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nest-react-boilerplate
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nmime/nest-react-boilerplate.git
    targetRevision: main
    path: .helm
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
      parameters:
        - name: "imagePullSecrets[0].name"
          value: "ghcr-credentials"
          forceString: true
  destination:
    server: https://kubernetes.default.svc
    namespace: nest-react-boilerplate
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true

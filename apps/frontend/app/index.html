<!doctype html>
<!-- `data-app` names the Compose service, not the product. Deployment readiness probes match it
     precisely because a rebrand cannot move it, unlike the title below. -->
<html lang="en" data-app="user-app">
  <head>
    <meta charset="utf-8" />
    <!-- Pre-hydration defaults. The product identity below (title, theme colour,
         icon) is rewritten at build time and again at start-up from the shared
         product brand, which reads VITE_PRODUCT_* / runtime-config.js — rebrand
         there, not here. -->
    <title>User App</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Per-deployment runtime config; must load before the app bundle so flags
         are readable synchronously. Rewritten at container start. -->
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

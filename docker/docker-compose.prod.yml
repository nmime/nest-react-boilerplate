name: nest-react-boilerplate

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '${DOCKER_LOG_MAX_SIZE:-10m}'
    max-file: '${DOCKER_LOG_MAX_FILES:-5}'

x-backend-env: &backend-env
  NODE_ENV: production
  PORT: 80
  TRUST_PROXY: ${TRUST_PROXY:-true}
  CORS_ORIGINS: ${CORS_ORIGINS:?set comma-separated production origins}
  AUTH_PERSISTENCE: postgres
  AUTH_GEOIP_DATABASE_PATH: ${AUTH_GEOIP_DATABASE_PATH:-}
  AUTH_LOGIN_NETWORK_RETENTION_DAYS: ${AUTH_LOGIN_NETWORK_RETENTION_DAYS:-30}
  AUTH_LOGIN_EVENT_RETENTION_DAYS: ${AUTH_LOGIN_EVENT_RETENTION_DAYS:-365}
  AUTH_LOGIN_ANALYTICS_IP_HASH_SECRET: ${AUTH_LOGIN_ANALYTICS_IP_HASH_SECRET:-}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://user-app.example.com}
  BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-https://user-app.example.com,https://example.com}
  AUTH_ALLOWED_RETURN_URLS: ${AUTH_ALLOWED_RETURN_URLS:?set comma-separated allowed auth return URL origins}
  AUTH_PROVIDER_TOKEN_ENCRYPTION_ENABLED: ${AUTH_PROVIDER_TOKEN_ENCRYPTION_ENABLED:-true}
  AUTH_PROVIDER_TOKEN_ENCRYPTION_KEY_ID: ${AUTH_PROVIDER_TOKEN_ENCRYPTION_KEY_ID:-primary}
  AUTH_NOTIFICATION_PROVIDER: ${AUTH_NOTIFICATION_PROVIDER:-resend}
  NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-resend}
  NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:-}
  NOTIFICATION_PAYLOAD_ENCRYPTION_KEY_ID: ${NOTIFICATION_PAYLOAD_ENCRYPTION_KEY_ID:-primary}
  NOTIFICATION_DELIVERIES_PER_ITERATION: ${NOTIFICATION_DELIVERIES_PER_ITERATION:-50}
  NOTIFICATION_REQUESTS_PER_SECOND: ${NOTIFICATION_REQUESTS_PER_SECOND:-30}
  NOTIFICATION_DELIVERIES_PARTITION_AHEAD_MONTHS: ${NOTIFICATION_DELIVERIES_PARTITION_AHEAD_MONTHS:-6}
  NOTIFICATION_BROADCAST_REQUIRE_INDEPENDENT_APPROVAL: ${NOTIFICATION_BROADCAST_REQUIRE_INDEPENDENT_APPROVAL:-false}
  NOTIFICATION_CONSUMER_INTERVAL_MS: ${NOTIFICATION_CONSUMER_INTERVAL_MS:-1000}
  NOTIFICATION_MATERIALIZATION_CHUNK_SIZE: ${NOTIFICATION_MATERIALIZATION_CHUNK_SIZE:-500}
  NOTIFICATION_CSV_MAX_BYTES: ${NOTIFICATION_CSV_MAX_BYTES:-10485760}
  NOTIFICATION_CSV_MAX_ROWS: ${NOTIFICATION_CSV_MAX_ROWS:-100000}
  NOTIFICATION_FCM_PROJECT_ID: ${NOTIFICATION_FCM_PROJECT_ID:-}
  NOTIFICATION_FCM_CLIENT_EMAIL: ${NOTIFICATION_FCM_CLIENT_EMAIL:-}
  NOTIFICATION_FCM_TOKEN_URI: ${NOTIFICATION_FCM_TOKEN_URI:-https://oauth2.googleapis.com/token}
  NOTIFICATION_APNS_TEAM_ID: ${NOTIFICATION_APNS_TEAM_ID:-}
  NOTIFICATION_APNS_KEY_ID: ${NOTIFICATION_APNS_KEY_ID:-}
  NOTIFICATION_APNS_BUNDLE_ID: ${NOTIFICATION_APNS_BUNDLE_ID:-}
  NOTIFICATION_APNS_SANDBOX: ${NOTIFICATION_APNS_SANDBOX:-false}
  AUTH_TELEGRAM_ENABLED: ${AUTH_TELEGRAM_ENABLED:-false}
  TELEGRAM_TMA_MAX_AGE_SECONDS: ${TELEGRAM_TMA_MAX_AGE_SECONDS:-300}
  TELEGRAM_OIDC_ENABLED: ${TELEGRAM_OIDC_ENABLED:-false}
  TELEGRAM_OIDC_CLIENT_ID: ${TELEGRAM_OIDC_CLIENT_ID:-}
  TELEGRAM_OIDC_SCOPES: ${TELEGRAM_OIDC_SCOPES:-openid profile}
  TELEGRAM_OIDC_DISCOVERY_URL: ${TELEGRAM_OIDC_DISCOVERY_URL:-}
  TELEGRAM_OIDC_ISSUER: ${TELEGRAM_OIDC_ISSUER:-}
  TELEGRAM_OIDC_JWKS_URL: ${TELEGRAM_OIDC_JWKS_URL:-}
  AUTH_TOKEN_CLEANUP_ENABLED: ${AUTH_TOKEN_CLEANUP_ENABLED:-true}
  AUTH_TOKEN_CLEANUP_INTERVAL_MS: ${AUTH_TOKEN_CLEANUP_INTERVAL_MS:-3600000}
  AUTH_TOKEN_CLEANUP_RUN_ON_START: ${AUTH_TOKEN_CLEANUP_RUN_ON_START:-true}
  ADMIN_BOOTSTRAP_EMAILS: ${ADMIN_BOOTSTRAP_EMAILS:-}
  AUTH_OAUTH_ENABLED: ${AUTH_OAUTH_ENABLED:-false}
  AUTH_OAUTH_ISSUER_URL: ${AUTH_OAUTH_ISSUER_URL:-}
  AUTH_OAUTH_CLIENT_ID: ${AUTH_OAUTH_CLIENT_ID:-}
  AUTH_OAUTH_CLIENT_SECRET: ${AUTH_OAUTH_CLIENT_SECRET:-}
  AUTH_OAUTH_REDIRECT_URI: ${AUTH_OAUTH_REDIRECT_URI:-}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-redis}
  RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-nrb:}
  REDIS_LAZY_CONNECT: ${REDIS_LAZY_CONNECT:-true}
  NATS_SERVERS: ${NATS_SERVERS:-}
  NATS_NAME: ${NATS_NAME:-nest-react-boilerplate}
  NATS_USER: ${NATS_USER:-}
  NATS_PASS: ${NATS_PASS:-}
  NATS_TOKEN: ${NATS_TOKEN:-}
  NATS_DRAIN_TIMEOUT_MS: ${NATS_DRAIN_TIMEOUT_MS:-5000}
  OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
  OPENAPI_PATH: ${OPENAPI_PATH:-docs}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-nest_react_boilerplate}
  POSTGRES_DB: ${POSTGRES_DB:-nest_react_boilerplate}
  POSTGRES_SSL: ${POSTGRES_SSL:-false}
  POSTGRES_SSL_REJECT_UNAUTHORIZED: ${POSTGRES_SSL_REJECT_UNAUTHORIZED:-true}
  POSTGRES_SYNCHRONIZE: 'false'
  POSTGRES_LOGGING: ${POSTGRES_LOGGING:-false}
  POSTGRES_POOL_MIN: ${POSTGRES_POOL_MIN:-2}
  POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-10}
  POSTGRES_POOL_IDLE_TIMEOUT_MS: ${POSTGRES_POOL_IDLE_TIMEOUT_MS:-30000}
  POSTGRES_SLOW_QUERY_MS: ${POSTGRES_SLOW_QUERY_MS:-}
  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_METRICS_HEADERS: ${OTEL_EXPORTER_OTLP_METRICS_HEADERS:-}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-60000}
  OTEL_SDK_DISABLED: false
  OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-1.0.0}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  STATIC_DATA_ROOT: ${STATIC_DATA_ROOT:-data}

x-backend-command: &backend-command
  - sh
  - -ec
  - |
    if [ -z "$${DATABASE_URL:-}" ]; then
      if [ -z "$${POSTGRES_PASSWORD:-}" ]; then
        echo "DATABASE_URL is unavailable: select the bundled-db or external-db Compose overlay" >&2
        exit 1
      fi
      DATABASE_URL="$$(node -e "const e = encodeURIComponent; const env = process.env; process.stdout.write('postgres://'+e(env.POSTGRES_USER ?? '')+':'+e(env.POSTGRES_PASSWORD ?? '')+'@postgres:5432/'+e(env.POSTGRES_DB ?? ''));")"
      export DATABASE_URL
    fi
    exec node "$${BUILD_OUTPUT:?set BUILD_OUTPUT}"

x-migrate-command: &migrate-command
  - sh
  - -ec
  - |
    if [ -z "$${DATABASE_URL:-}" ]; then
      if [ -z "$${POSTGRES_PASSWORD:-}" ]; then
        echo "DATABASE_URL is unavailable: select the bundled-db or external-db Compose overlay" >&2
        exit 1
      fi
      DATABASE_URL="$$(node -e "const e = encodeURIComponent; const env = process.env; process.stdout.write('postgres://'+e(env.POSTGRES_USER ?? '')+':'+e(env.POSTGRES_PASSWORD ?? '')+'@postgres:5432/'+e(env.POSTGRES_DB ?? ''));")"
      export DATABASE_URL
    fi
    exec node docker/migrator-run.mjs

x-backend-healthcheck: &backend-healthcheck
  test:
    [
      'CMD-SHELL',
      'node -e "fetch(''http://127.0.0.1:80/ready'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
    ]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

x-frontend-healthcheck: &frontend-healthcheck
  test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/nginx-health | grep -q ok']
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 10s

x-backend-service: &backend-service
  restart: unless-stopped
  logging: *default-logging
  networks: [app, database]
  secrets: [session_secret, better_auth_secret, redis_password, notification_payload_encryption_key]
  environment: *backend-env
  command: *backend-command
  depends_on:
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  healthcheck: *backend-healthcheck

x-frontend-service: &frontend-service
  restart: unless-stopped
  logging: *default-logging
  networks: [app]
  healthcheck: *frontend-healthcheck
  # Browser-safe runtime flags rendered into /runtime-config.js at container
  # start, so toggling a feature never requires rebuilding the SPA image. Never
  # place secrets here — the generated file is served to every browser.
  environment:
    TELEGRAM_AUTH_ENABLED: ${AUTH_TELEGRAM_ENABLED:-false}
    DISCORD_AUTH_ENABLED: ${DISCORD_AUTH_ENABLED:-false}

x-notification-scheduler-service: &notification-scheduler-service
  restart: unless-stopped
  logging: *default-logging
  networks: [app, database]
  secrets:
    [
      notification_payload_encryption_key,
      telegram_bot_token,
      discord_bot_token,
      resend_api_key,
      mailpace_server_token,
      notification_fcm_private_key,
      notification_apns_private_key,
    ]
  environment: *backend-env
  command: *backend-command
  depends_on:
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

x-site-healthcheck: &site-healthcheck
  test:
    [
      'CMD-SHELL',
      'node -e "fetch(''http://127.0.0.1:80/ready'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
    ]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

services:
  redis:
    image: redis:7.4.3-alpine
    restart: unless-stopped
    logging: *default-logging
    command:
      - sh
      - -ec
      - |
        umask 077
        printf 'appendonly yes\nrequirepass %s\n' "$$(cat /run/secrets/redis_password)" >/tmp/redis.conf
        exec redis-server /tmp/redis.conf
    secrets: [redis_password]
    volumes:
      - redis-data:/data
    networks: [database]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    image: ${IMAGE_REGISTRY:-ghcr.io/your-github-org/nest-react-boilerplate}/migrator:${IMAGE_TAG:?set IMAGE_TAG to an immutable sha-<git-sha> tag; never use latest}
    logging: *default-logging
    restart: 'no'
    networks: [app, database]
    environment: *backend-env
    command: *migrate-command

  admin-app-api:
    <<: *backend-service
    image: ${IMAGE_REGISTRY:-ghcr.io/your-github-org/nest-react-boilerplate}/admin-app-api:${IMAGE_TAG:?set IMAGE_TAG to an immutable sha-<git-sha> tag; never use latest}
    ports:
      - target: 80
        published: '${ADMIN_APP_API_PORT:-3001}'
        host_ip: 127.0.0.1
        protocol: tcp

  user-app-api:
    <<: *backend-service
    image: ${IMAGE_REGISTRY:-ghcr.io/your-github-org/nest-react-boilerplate}/user-app-api:${IMAGE_TAG:?set IMAGE_TAG to an immutable sha-<git-sha> tag; never use latest}
    ports:
      - target: 80
        published: '${USER_APP_API_PORT:-3002}'
        host_ip: 127.0.0.1
        protocol: tcp

  auth-app-api:
    <<: *backend-service
    image: ${IMAGE_REGISTRY:-ghcr.io/your-github-org/nest-react-boilerplate}/auth-app-api:${IMAGE_TAG:?set IMAGE_TAG to an immutable sha-<git-sha> tag; never use latest}
    secrets:
      - session_secret
      - better_auth_secret
      - auth_provider_token_encryption_key
      - notification_payload_encryption_key
      - redis_password
    ports:
      - target: 80
        published: '${AUTH_APP_API_PORT:-3003}'
        host_ip: 127.0.0.1
        protocol: tcp

  discord-app-api:
    <<: *backend-service
    profiles: [discord]
    image: ${IMAGE_REGISTRY:-ghcr.io/your-github-org/nest-react-boilerplate}/discord-app-api:${IMAGE_TAG:?set IMAGE_TAG to an immutable sha-<git-sha> tag; never use latest}
    environment:
      <<: *backend-env
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_COMMAND_REGISTRATION_ENABLED: ${DISCORD_COMMAND_REGISTRATION_ENABLED:-false}
      DISCORD_COMMAND_REGISTRATION_SCOPE: ${DISCORD_COMMAND_REGISTRATION_SCOPE:-global}
      DISCORD_REGISTRATION_GUILD_ID: ${DISCORD_REGISTRATION_GUILD_ID:-}
      DISCORD_WEB_APP_BASE_URL: ${DISCORD_WEB_APP_BASE_URL:-https://user-app.example.com}
      DISCORD_DEFAULT_TENANT_ID: ${DISCORD_DEFAULT_TENANT_ID:-}
    secrets:
      [
        session_secret,
        redis_password,
        notification_payload_encryption_key,
        discord_bot_token,
        discord_public_key,
        discord_custom_id_secret,
      ]
    ports:
      - target: 80
        published: '${DISCORD_APP_API_PORT:-3007}'
        host_ip: 127.0.0.1
        protocol: tcp

  telegram-bot-api:
    <<: *backend-service
    profiles: [telegram]
    image: ${IMAGE_REGISTRY:-ghcr.io/your-github-org/nest-react-boilerplate}/telegram-bot-api:${IMAGE_TAG:?set IMAGE_TAG to an immutable sha-<git-sha> tag; never use latest}
    environment:
      <<: *backend-env
      TELEGRAM_BOT_MODE: ${TELEGRAM_BOT_MODE:-webhook}
      TELEGRAM_BOT_WEBHOOK_URL: ${TELEGRAM_BOT_WEBHOOK_URL:-https://telegram-bot-api.example.com/telegram/webhook}
      TELEGRAM_MINI_APP_URL: ${TELEGRAM_MINI_APP_URL:-https://user-app.example.com/telegram-mini-app}
      TELEGRAM_BOT_MENU_BUTTON_ENABLED: ${TELEGRAM_BOT_MENU_BUTTON_ENABLED:-true}
      TELEGRAM_BOT_SESSION_TTL_SECONDS: ${TELEGRAM_BOT_SESSION_TTL_SECONDS:-1209600}
      TELEGRAM_BOT_RATE_LIMIT_WINDOW_MS: ${TELEGRAM_BOT_RATE_LIMIT_WINDOW_MS:-1000}
      TELEGRAM_BOT_RATE_LIMIT: ${TELEGRAM_BOT_RATE_LIMIT:-3}
    secrets:
      [
        session_secret,
        redis_password,
        notification_payload_encryption_key,
        telegram_bot_token,
        telegram_bot_webhook_secret,
      ]
    ports:
      - target: 80
        published: '${TELEGRAM_BOT_API_PORT:-3013}'
        host_ip: 127.0.0.1
        protocol: tcp

  notification-scheduler:
    <<: *notification-scheduler-service
    profiles: [notification-scheduler]
    image: ${IMAGE_REGISTRY:-ghcr.io/your-github-org/nest-react-boilerplate}/notification-scheduler:${IMAGE_TAG:?set IMAGE_TAG to an immutable sha-<git-sha> tag; never use latest}

  notification-consumer:
    restart: unless-stopped
    logging: *default-logging
    networks: [app, database]
    profiles: [notification-consumer]
    image: ${IMAGE_REGISTRY:-ghcr.io/your-github-org/nest-react-boilerplate}/notification-consumer:${IMAGE_TAG:?set IMAGE_TAG to an immutable sha-<git-sha> tag; never use latest}
    secrets: [notification_payload_encryption_key]
    environment: *backend-env
    command: *backend-command
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  admin-app:
    <<: *frontend-service
    image: ${IMAGE_REGISTRY:-ghcr.io/your-github-org/nest-react-boilerplate}/admin-app:${IMAGE_TAG:?set IMAGE_TAG to an immutable sha-<git-sha> tag; never use latest}
    depends_on:
      admin-app-api:
        condition: service_healthy
    ports:
      - target: 8080
        published: '${ADMIN_APP_PORT:-4200}'
        host_ip: 127.0.0.1
        protocol: tcp

  user-app:
    <<: *frontend-service
    image: ${IMAGE_REGISTRY:-ghcr.io/your-github-org/nest-react-boilerplate}/user-app:${IMAGE_TAG:?set IMAGE_TAG to an immutable sha-<git-sha> tag; never use latest}
    depends_on:
      auth-app-api:
        condition: service_healthy
      user-app-api:
        condition: service_healthy
    ports:
      - target: 8080
        published: '${USER_APP_PORT:-4201}'
        host_ip: 127.0.0.1
        protocol: tcp

  landing-app:
    <<: *frontend-service
    image: ${IMAGE_REGISTRY:-ghcr.io/your-github-org/nest-react-boilerplate}/landing-app:${IMAGE_TAG:?set IMAGE_TAG to an immutable sha-<git-sha> tag; never use latest}
    depends_on:
      auth-app-api:
        condition: service_healthy
      user-app-api:
        condition: service_healthy
      admin-app-api:
        condition: service_healthy
    ports:
      - target: 8080
        published: '${LANDING_APP_PORT:-4202}'
        host_ip: 127.0.0.1
        protocol: tcp

  site-app:
    restart: unless-stopped
    logging: *default-logging
    networks: [app]
    image: ${IMAGE_REGISTRY:-ghcr.io/your-github-org/nest-react-boilerplate}/site-app:${IMAGE_TAG:?set IMAGE_TAG to an immutable sha-<git-sha> tag; never use latest}
    depends_on:
      auth-app-api:
        condition: service_healthy
      user-app-api:
        condition: service_healthy
      admin-app-api:
        condition: service_healthy
    ports:
      - target: 80
        published: '${SITE_APP_PORT:-4203}'
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck: *site-healthcheck

  mobile-app:
    <<: *frontend-service
    image: ${IMAGE_REGISTRY:-ghcr.io/your-github-org/nest-react-boilerplate}/mobile-app:${IMAGE_TAG:?set IMAGE_TAG to an immutable sha-<git-sha> tag; never use latest}
    depends_on:
      auth-app-api:
        condition: service_healthy
      user-app-api:
        condition: service_healthy
    ports:
      - target: 8080
        published: '${MOBILE_APP_PORT:-4300}'
        host_ip: 127.0.0.1
        protocol: tcp

  # Observability: OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - target: 4317
        published: '${OTEL_COLLECTOR_GRPC_PORT:-4317}'
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 4318
        published: '${OTEL_COLLECTOR_HTTP_PORT:-4318}'
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 9464
        published: '${OTEL_PROMETHEUS_PORT:-9464}'
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:13133/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging: *default-logging
    networks: [app]

  # Observability: Prometheus
  prometheus:
    image: prom/prometheus:v3.3.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - target: 9090
        published: '${PROMETHEUS_PORT:-9090}'
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9090/-/healthy || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging: *default-logging
    networks: [app]
    depends_on:
      alertmanager:
        condition: service_healthy

  # Observability: Alertmanager
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - target: 9093
        published: '${ALERTMANAGER_PORT:-9093}'
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9093/-/healthy || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging: *default-logging
    networks: [app]

  # Observability: Grafana
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD_FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - target: 3000
        published: '${GRAFANA_PORT:-3000}'
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging: *default-logging
    networks: [app]
    secrets: [grafana_admin_password]
    depends_on:
      prometheus:
        condition: service_healthy

networks:
  app:
  database:
    internal: true

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:

secrets:
  session_secret:
    file: ${SESSION_SECRET_FILE:-./secrets/session_secret.txt}
  better_auth_secret:
    file: ${BETTER_AUTH_SECRET_FILE:-./secrets/better_auth_secret.txt}
  auth_provider_token_encryption_key:
    file: ${AUTH_PROVIDER_TOKEN_ENCRYPTION_KEY_FILE:-./secrets/auth_provider_token_encryption_key.txt}
  notification_payload_encryption_key:
    file: ${NOTIFICATION_PAYLOAD_ENCRYPTION_KEY_FILE:-./secrets/notification_payload_encryption_key.txt}
  redis_password:
    file: ${REDIS_PASSWORD_FILE:-./secrets/redis_password.txt}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:-./secrets/grafana_admin_password.txt}
  telegram_bot_token:
    file: ${TELEGRAM_BOT_TOKEN_FILE:-./secrets/telegram_bot_token.txt}
  telegram_oidc_client_secret:
    file: ${TELEGRAM_OIDC_CLIENT_SECRET_FILE:-./secrets/telegram_oidc_client_secret.txt}
  telegram_bot_webhook_secret:
    file: ${TELEGRAM_BOT_WEBHOOK_SECRET_FILE:-./secrets/telegram_bot_webhook_secret.txt}
  discord_bot_token:
    file: ${DISCORD_BOT_TOKEN_FILE:-./secrets/discord_bot_token.txt}
  discord_client_secret:
    file: ${DISCORD_CLIENT_SECRET_FILE:-./secrets/discord_client_secret.txt}
  discord_public_key:
    file: ${DISCORD_PUBLIC_KEY_FILE:-./secrets/discord_public_key.txt}
  discord_custom_id_secret:
    file: ${DISCORD_CUSTOM_ID_SECRET_FILE:-./secrets/discord_custom_id_secret.txt}
  resend_api_key:
    file: ${RESEND_API_KEY_FILE:-./secrets/resend_api_key.txt}
  mailpace_server_token:
    file: ${MAILPACE_SERVER_TOKEN_FILE:-./secrets/mailpace_server_token.txt}
  notification_fcm_private_key:
    file: ${NOTIFICATION_FCM_PRIVATE_KEY_FILE:-./secrets/notification_fcm_private_key.txt}
  notification_apns_private_key:
    file: ${NOTIFICATION_APNS_PRIVATE_KEY_FILE:-./secrets/notification_apns_private_key.txt}

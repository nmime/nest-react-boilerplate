version: 3
capability: payment-ordering
owners:
  product: runtime-maintainers
  verification: backend-maintainers
  security: security-maintainers
  operations: platform-operations
requirements:
  - id: REQ-PAYMENTS-SCAFFOLD-001
    projects:
      - '@app/backend-feature-payments-shared'
      - '@app/backend-feature-payments-main'
      - '@app/backend-feature-payments-admin'
      - '@app/backend-postgres-main-payments'
      - '@app/backend-mongodb-main-payments'
    risk: normal
    profiles:
      - domain
      - documentation
    cucumber:
      disposition: not-applicable
      reason: Scaffold compilation and alias resolution are proven by the five projects' own unit suites, which run on every pull request.
      alternativeEvidence:
        - vitest
    evidence:
      - kind: vitest
        file: libs/backend/feature/payments/shared/lib/src/index.spec.ts
        target: '@app/backend-feature-payments-shared:test'
        lanes:
          - pr
          - main
      - kind: vitest
        file: libs/backend/feature/payments/main/lib/src/payments-main.module.spec.ts
        target: '@app/backend-feature-payments-main:test'
        lanes:
          - pr
          - main
      - kind: vitest
        file: libs/backend/feature/payments/admin/lib/src/payments-admin.module.spec.ts
        target: '@app/backend-feature-payments-admin:test'
        lanes:
          - pr
          - main
      - kind: vitest
        file: libs/backend/postgres/main/payments/lib/src/infrastructure/data-access/entities/payments.entity.spec.ts
        target: '@app/backend-postgres-main-payments:test'
        lanes:
          - pr
          - main
      - kind: vitest
        file: libs/backend/mongodb/main/payments/lib/src/index.spec.ts
        target: '@app/backend-mongodb-main-payments:test'
        lanes:
          - pr
          - main
      - kind: documentation
        file: openspec/specs/payment-ordering/spec.md
        lanes:
          - pr
          - main

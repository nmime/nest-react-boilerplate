# Product operators must configure real notification integrations explicitly.
# Alertmanager does not expand shell-style environment variables in this file.
# These valid empty receivers retain and group alerts without sending them.
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - matchers: ['severity="critical"']
      receiver: 'critical-alerts'
      repeat_interval: 1h
    - matchers: ['severity="warning"']
      receiver: 'warning-alerts'
      repeat_interval: 4h

receivers:
  - name: 'default'
  - name: 'critical-alerts'
  - name: 'warning-alerts'

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ['alertname', 'service']

version: 3
capability: frontend-experience
owners:
  product: frontend-maintainers
  verification: accessibility-quality
requirements:
  - id: REQ-FRONTEND-JOURNEY-001
    projects:
      - admin-app
      - user-app
      - landing-app
      - site-app
      - mobile-app
      - fullstack-e2e
    risk: high
    profiles:
      - journey
      - domain
    cucumber:
      disposition: not-applicable
      reason: Cross-renderer navigation and recovery are executable user journeys whose faithful boundary is Playwright.
      alternativeEvidence:
        - playwright
        - vitest
    evidence:
      - kind: playwright
        file: apps/e2e/fullstack/src/fullstack.spec.ts
        target: fullstack-e2e:e2e
        lanes:
          - runtime
      - kind: vitest
        file: libs/frontend/ui-web/lib/src/component/design-system-contract.spec.tsx
        target: '@app/frontend-ui-web:test'
        lanes:
          - pr
          - main
  - id: REQ-FRONTEND-I18N-002
    projects:
      - '@app/backend-common-i18n'
      - '@app/common-i18n-keys'
      - '@app/common-i18n-runtime'
      - '@app/frontend-feature-admin-i18n'
      - '@app/frontend-feature-landing-i18n'
      - '@app/frontend-feature-user-i18n'
      - '@app/frontend-i18n-shared'
      - '@app/frontend-runtime'
      - '@app/i18n-en-admin'
      - '@app/i18n-en-common'
      - '@app/i18n-en-landing'
      - '@app/i18n-en-user'
      - '@app/i18n-ru-admin'
      - '@app/i18n-ru-common'
      - '@app/i18n-ru-landing'
      - '@app/i18n-ru-user'
    risk: normal
    profiles:
      - domain
      - documentation
    cucumber:
      disposition: not-applicable
      reason: Locale-key parity and renderer ownership are catalog invariants best checked directly and documented normatively.
      alternativeEvidence:
        - vitest
        - documentation
    evidence:
      - kind: vitest
        file: libs/frontend/runtime/lib/src/i18n/domain-namespace.spec.ts
        target: '@app/frontend-runtime:test'
        lanes:
          - pr
          - main
      - kind: documentation
        file: openspec/specs/frontend-experience/spec.md
        lanes:
          - pr
          - main
  - id: REQ-FRONTEND-ACCESSIBILITY-003
    projects:
      - admin-app
      - user-app
      - '@app/frontend-ui-web'
      - '@app/frontend-ui-native'
    risk: high
    profiles:
      - domain
      - journey
    cucumber:
      disposition: not-applicable
      reason: Keyboard, focus, and semantic behavior require rendered component assertions and real browser interaction.
      alternativeEvidence:
        - vitest
        - playwright
    evidence:
      - kind: vitest
        file: libs/frontend/ui-web/lib/src/component/design-system-contract.spec.tsx
        target: '@app/frontend-ui-web:test'
        lanes:
          - pr
          - main
      - kind: playwright
        file: apps/e2e/fullstack/src/fullstack.spec.ts
        target: fullstack-e2e:e2e
        lanes:
          - runtime
  - id: REQ-FRONTEND-SHELL-004
    projects:
      - admin-app
      - user-app
      - landing-app
      - site-app
      - mobile-app
      - '@app/frontend-feature-admin-shared'
      - '@app/frontend-runtime'
    risk: high
    profiles:
      - domain
      - journey
    cucumber:
      disposition: not-applicable
      reason: Route and provider composition is verified in owning renderers through focused tests and full-stack navigation.
      alternativeEvidence:
        - vitest
        - playwright
    evidence:
      - kind: vitest
        file: apps/frontend/admin/src/app/admin-routing.spec.tsx
        target: admin-app:test
        lanes:
          - pr
          - main
      - kind: playwright
        file: apps/e2e/fullstack/src/fullstack.spec.ts
        target: fullstack-e2e:e2e
        lanes:
          - runtime
  - id: REQ-FRONTEND-ERROR-005
    projects:
      - admin-app
      - user-app
      - '@app/frontend-api-support'
      - '@app/frontend-ui-web'
    risk: high
    profiles:
      - domain
      - api
      - journey
    cucumber:
      disposition: not-applicable
      reason: Safe error rendering depends on typed API responses and browser recovery states that contracts and Playwright exercise.
      alternativeEvidence:
        - contract
        - playwright
    evidence:
      - kind: vitest
        file: libs/frontend/ui-web/lib/src/component/api-runtime-overlay.spec.tsx
        target: '@app/frontend-ui-web:test'
        lanes:
          - pr
          - main
      - kind: contract
        file: libs/frontend/api-support/lib/src/runtime-fetch.spec.ts
        target: '@app/frontend-api-support:test'
        lanes:
          - pr
          - main
      - kind: playwright
        file: apps/e2e/fullstack/src/fullstack.spec.ts
        target: fullstack-e2e:e2e
        lanes:
          - runtime
  - id: REQ-FRONTEND-NATIVE-006
    projects:
      - mobile-app
      - '@app/frontend-ui-native'
    risk: high
    profiles:
      - domain
      - tooling
    cucumber:
      disposition: not-applicable
      reason: Native export and DOM-boundary safety are compile-time and renderer-specific contracts rather than Gherkin examples.
      alternativeEvidence:
        - static
        - vitest
    evidence:
      - kind: vitest
        file: apps/frontend/mobile/src/mobile-app-providers.spec.tsx
        target: mobile-app:test
        lanes:
          - pr
          - main
      - kind: static
        file: apps/frontend/mobile/src/expo-route-boundary.spec.ts
        target: mobile-app:typecheck
        lanes:
          - pr
          - main
  - id: REQ-FRONTEND-SSR-007
    projects:
      - landing-app
      - site-app
    risk: high
    profiles:
      - domain
      - journey
    cucumber:
      disposition: not-applicable
      reason: Server rendering and hydration consistency must be exercised in the actual SSR browser lifecycle.
      alternativeEvidence:
        - playwright
        - vitest
    evidence:
      - kind: vitest
        file: apps/frontend/site/pages/index/+Page.spec.tsx
        target: site-app:test
        lanes:
          - pr
          - main
      - kind: playwright
        file: apps/e2e/fullstack/src/fullstack.spec.ts
        target: fullstack-e2e:e2e
        lanes:
          - runtime
  - id: REQ-FRONTEND-DESIGN-008
    projects:
      - '@app/common-design-tokens'
      - '@app/frontend-ui-native'
      - '@app/frontend-ui-web'
    risk: normal
    profiles:
      - domain
      - documentation
    cucumber:
      disposition: not-applicable
      reason: Token, export, and source-ownership rules are structural design-system contracts with reviewed documentation.
      alternativeEvidence:
        - vitest
        - documentation
    evidence:
      - kind: vitest
        file: libs/frontend/ui-web/lib/src/component/design-system-contract.spec.tsx
        target: '@app/frontend-ui-web:test'
        lanes:
          - pr
          - main
      - kind: documentation
        file: openspec/specs/frontend-experience/spec.md
        lanes:
          - pr
          - main

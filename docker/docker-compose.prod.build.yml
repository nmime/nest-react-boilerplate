# Source-build overlay for an operator who explicitly needs to build from this
# checkout. Normal production deployments use immutable registry images and do
# not load this file.
x-nrb-build: &nrb-build
  context: ..
  dockerfile: Dockerfile
  additional_contexts:
    nrb-closure: ${NRB_CLOSURE_CONTEXT:?run pnpm nrb closure install before Docker source builds}

# Build arguments every browser bundle takes. The product identity belongs here rather than only
# in the runtime environment: /runtime-config.js can rebrand what the bundle renders, but nothing
# rewrites the markup the image ships, so a source build without these produces a permanently
# boilerplate-branded tab title, icon and link preview.
x-frontend-build-args: &frontend-build-args
  NGINX_CONFIG: ${FRONTEND_NGINX_CONFIG:-docker/nginx-fullstack.conf}
  VITE_AUTH_API_BASE_URL: ${VITE_AUTH_API_BASE_URL:-}
  VITE_USER_API_BASE_URL: ${VITE_USER_API_BASE_URL:-}
  VITE_ADMIN_API_BASE_URL: ${VITE_ADMIN_API_BASE_URL:-}
  VITE_API_BASE_URL_MODE: ${VITE_API_BASE_URL_MODE:-same-origin}
  VITE_PRODUCT_NAME: ${VITE_PRODUCT_NAME:-}
  VITE_PRODUCT_ICON_HREF: ${VITE_PRODUCT_ICON_HREF:-}
  VITE_PRODUCT_ICON_TYPE: ${VITE_PRODUCT_ICON_TYPE:-}
  VITE_PRODUCT_THEME_COLOR: ${VITE_PRODUCT_THEME_COLOR:-}
  VITE_PRODUCT_CHROME_BACKGROUND_COLOR: ${VITE_PRODUCT_CHROME_BACKGROUND_COLOR:-}
  VITE_PRODUCT_CHROME_BOTTOM_BAR_COLOR: ${VITE_PRODUCT_CHROME_BOTTOM_BAR_COLOR:-}
  VITE_PRODUCT_CHROME_HEADER_COLOR: ${VITE_PRODUCT_CHROME_HEADER_COLOR:-}

services:
  migrate:
    build:
      <<: *nrb-build
      target: migrator

  admin-app-api:
    build:
      <<: *nrb-build
      target: backend
      args:
        NX_PROJECT: admin-app-api
        BUILD_OUTPUT: dist/apps/backend/admin/admin-app-api

  user-app-api:
    build:
      <<: *nrb-build
      target: backend
      args:
        NX_PROJECT: user-app-api
        BUILD_OUTPUT: dist/apps/backend/user/user-app-api

  auth-app-api:
    build:
      <<: *nrb-build
      target: backend
      args:
        NX_PROJECT: auth-app-api
        BUILD_OUTPUT: dist/apps/backend/auth/auth-app-api

  discord-app-api:
    build:
      <<: *nrb-build
      target: backend
      args:
        NX_PROJECT: discord-app-api
        BUILD_OUTPUT: dist/apps/backend/discord/discord-app-api

  telegram-bot-api:
    build:
      <<: *nrb-build
      target: backend
      args:
        NX_PROJECT: telegram-bot-api
        BUILD_OUTPUT: dist/apps/backend/telegram/telegram-bot-api

  notification-scheduler:
    build:
      <<: *nrb-build
      target: backend
      args:
        NX_PROJECT: notification-scheduler
        BUILD_OUTPUT: dist/apps/backend/notification/notification-scheduler

  notification-consumer:
    build:
      <<: *nrb-build
      target: backend
      args:
        NX_PROJECT: notification-consumer
        BUILD_OUTPUT: dist/apps/backend/notification/notification-consumer

  admin-app:
    build:
      <<: *nrb-build
      target: frontend
      args:
        <<: *frontend-build-args
        NX_PROJECT: admin-app
        FRONTEND_OUTPUT: dist/apps/frontend/admin
        VITE_TELEGRAM_AUTH_ENABLED: ${VITE_TELEGRAM_AUTH_ENABLED:-false}

  user-app:
    build:
      <<: *nrb-build
      target: frontend
      args:
        <<: *frontend-build-args
        NX_PROJECT: user-app
        FRONTEND_OUTPUT: dist/apps/frontend/app
        VITE_TELEGRAM_AUTH_ENABLED: ${VITE_TELEGRAM_AUTH_ENABLED:-false}

  landing-app:
    build:
      <<: *nrb-build
      target: frontend
      args:
        <<: *frontend-build-args
        NX_PROJECT: landing-app
        FRONTEND_OUTPUT: dist/apps/frontend/landing

  site-app:
    build:
      <<: *nrb-build
      target: site-runtime
      args:
        NX_PROJECT: site-app

  mobile-app:
    build:
      <<: *nrb-build
      target: frontend
      args:
        <<: *frontend-build-args
        NX_PROJECT: mobile-app
        NX_TARGET: export
        FRONTEND_OUTPUT: dist/apps/frontend/mobile

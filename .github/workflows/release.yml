name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency: release
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository == 'nmime/nest-react-boilerplate'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with: { version: 11.11.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PROVIDER: github
          GIT_AUTHOR_NAME: nmime
          GIT_AUTHOR_EMAIL: 66474195+nmime@users.noreply.github.com
          GIT_COMMITTER_NAME: nmime
          GIT_COMMITTER_EMAIL: 66474195+nmime@users.noreply.github.com

name: Local runtime stack
description: Build and start the Compose runtime stack, retrying transient cold starts and dumping diagnostics when it stays down.

# Three lanes need a live stack: ci.yml `ops-gates`, quality-presets `presets`,
# and spec-assurance-nightly. Only `ops-gates` ever grew a retry, so the two
# nightly lanes failed on their first bad cold start and stayed red for 32
# nights with nothing in the log but "container is unhealthy".
#
# This action is the GitHub entry point only. The start sequence, the readiness
# rules, the retry, and the diagnostics all live in scripts/ci/runtime-stack.mjs,
# which the GitLab lane runs through scripts/ci/runtime-stack.sh. Keeping the
# sequence in one executable module is what stops the drift coming back, and it
# puts the readiness classification under test rather than only under CI.

inputs:
  compose-file:
    description: Compose file to bring up.
    required: false
    default: docker/docker-compose.yml
  attempts:
    description: How many times to try starting the stack before failing the step.
    required: false
    default: '3'
  readiness-timeout:
    description: Seconds to wait for every long-running service to report healthy.
    required: false
    default: '300'

runs:
  using: composite
  steps:
    - name: Start local runtime stack
      shell: bash
      env:
        COMPOSE_FILE_PATH: ${{ inputs.compose-file }}
        START_ATTEMPTS: ${{ inputs.attempts }}
        READINESS_TIMEOUT: ${{ inputs.readiness-timeout }}
      # The compose file path is workspace-relative, so this has to run from the
      # workspace root -- which is a composite action's default directory.
      run: node scripts/ci/runtime-stack.mjs

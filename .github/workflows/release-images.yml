name: Release images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Optional full SHA of the last deployed/released baseline'
        required: false
        type: string
      force_full:
        description: 'Build every release image instead of using the affected-image plan'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  PNPM_VERSION: 11.11.0
  HELM_VERSION: v4.2.3

jobs:
  helm-render:
    name: Helm render gate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate deployment config
        run: node scripts/validate-deployment-config.mjs
      - name: Validate Helm rate-limit config
        run: node scripts/validate-helm-rate-limit-config.mjs
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Validate Helm chart
        run: bash scripts/validate-helm.sh

  image-plan:
    name: Select affected release images
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      base: ${{ steps.plan.outputs.base }}
      has_images: ${{ steps.plan.outputs.has_images }}
      matrix: ${{ steps.plan.outputs.matrix }}
      reason: ${{ steps.plan.outputs.reason }}
      selected_images: ${{ steps.plan.outputs.selected_images }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependency metadata for Nx impact analysis
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify Docker dependency manifests
        run: pnpm run docker:manifests:check

      - name: Build the affected-image plan
        id: plan
        env:
          INPUT_BASE_SHA: ${{ inputs.base_sha || '' }}
          INPUT_FORCE_FULL: ${{ inputs.force_full || false }}
        run: |
          args=(--head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT")
          if [ -n "$INPUT_BASE_SHA" ]; then args+=(--base "$INPUT_BASE_SHA"); fi
          if [ "$INPUT_FORCE_FULL" = 'true' ]; then args+=(--force-full); fi
          node scripts/release-image-plan.mjs "${args[@]}"

      - name: Write image-plan summary
        env:
          BASE: ${{ steps.plan.outputs.base }}
          REASON: ${{ steps.plan.outputs.reason }}
          SELECTED_IMAGES: ${{ steps.plan.outputs.selected_images }}
        run: |
          {
            echo '## Release image plan'
            echo
            echo "- Baseline: ${BASE:-none (full release)}"
            echo "- Reason: $REASON"
            echo "- Images: ${SELECTED_IMAGES:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

  workspace-cache:
    name: Prime shared Docker workspace cache
    runs-on: ubuntu-22.04
    needs: image-plan
    if: needs.image-plan.outputs.has_images == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Export shared dependency cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: workspace
          outputs: type=cacheonly
          cache-from: type=gha,scope=release-workspace
          cache-to: type=gha,mode=max,scope=release-workspace

  build-scan-sign:
    name: Build, scan, and sign ${{ matrix.name }}
    runs-on: ubuntu-22.04
    needs: [helm-render, image-plan, workspace-cache]
    if: needs.image-plan.outputs.has_images == 'true'
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=release-workspace
            type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}
          build-args: |
            ${{ matrix.buildArgs }}
            VITE_TELEGRAM_AUTH_ENABLED=${{ vars.VITE_TELEGRAM_AUTH_ENABLED || 'false' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Generate SBOM artifact
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json
          if-no-files-found: error

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Cosign keyless sign image digest (GitHub OIDC)
        env:
          IMAGE_REF: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"

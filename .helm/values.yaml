nameOverride: ''
fullnameOverride: ''

imagePullSecrets: []

secrets:
  # Production should create this Secret outside the chart, for example with
  # External Secrets Operator, Vault, or the ansible-k8s-full-setup platform
  # secret flow. Set existingSecret to use one. Set create=true only when
  # supplying explicit non-placeholder values below.
  existingSecret: ''
  create: false
  authJwtSecret: ''
  databaseUrl: ''

config:
  nodeEnv: production
  corsOrigins: https://admin.example.com,https://app.example.com,https://example.com,https://site.example.com,https://mobile.example.com
  authJwtIssuer: https://auth.example.com
  authJwtAudience: nest-react-boilerplate-api
  authJwtExpiresInSeconds: '3600'
  # Expired persisted refresh/action token cleanup. Intervals below 60000ms are
  # clamped by the service to avoid tight cleanup loops from configuration typos.
  authTokenCleanupEnabled: 'true'
  authTokenCleanupIntervalMs: '3600000'
  authTokenCleanupRunOnStart: 'true'
  openApiEnabled: 'false'
  logLevel: info
  rateLimitEnabled: 'true'
  rateLimitStore: auto
  rateLimitWindowMs: '60000'
  rateLimitMax: '100'
  # Set redisUrl or redisHosts when using RATE_LIMIT_STORE=redis.
  redisUrl: ''
  redisHosts: ''
  redisMode: single
  redisKeyPrefix: 'nrb:'
  redisDb: ''

postgresql:
  host: postgresql
  port: '5432'
  database: nest_react_boilerplate
  user: postgres
  ssl: 'true'
  sslRejectUnauthorized: 'true'

migrations:
  enabled: true
  image:
    repository: ghcr.io/your-github-org/nest-react-boilerplate/migrator
    # Prefer immutable tags (sha-<git-sha>) or digest (sha256:...) for releases.
    tag: latest
    digest: ''
    pullPolicy: IfNotPresent
  command: ['pnpm', 'db:migrate']
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podSecurityContext: {}
  securityContext: {}

# Frontend Pods use a chart-rendered nginx config so in-cluster upstreams point
# at Helm Service DNS names instead of docker-compose service names baked into
# the image.
frontendNginx:
  enabled: true
  healthPath: /nginx-health
  listenPort: 8080
  cspConnectSrc: "'self'"

# The chart deploys Nest API services and the selected frontend renderers.
# starterApp is the neutral starter-preset shell and is intentionally opt-in;
# it is not an additional production product beside the reference frontends.
# API probes should keep /live and /ready; nginx probes use
# frontendNginx.healthPath when nginxConfig=true.
apps:
  authAppApi:
    kind: backend
    enabled: true
    replicas: 2
    port: 80
    servicePort: 80
    livenessPath: /live
    readinessPath: /ready
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/auth-app-api
      tag: latest
      digest: ''
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
    podSecurityContext: {}
    securityContext: {}
  userAppApi:
    kind: backend
    enabled: true
    replicas: 2
    port: 80
    servicePort: 80
    livenessPath: /live
    readinessPath: /ready
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/user-app-api
      tag: latest
      digest: ''
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
    podSecurityContext: {}
    securityContext: {}
  adminAppApi:
    kind: backend
    enabled: true
    replicas: 2
    port: 80
    servicePort: 80
    livenessPath: /live
    readinessPath: /ready
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/admin-app-api
      tag: latest
      digest: ''
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
    podSecurityContext: {}
    securityContext: {}
  discordAppApi:
    kind: backend
    enabled: false
    replicas: 1
    port: 80
    servicePort: 80
    livenessPath: /live
    readinessPath: /ready
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/discord-app-api
      tag: latest
      digest: ''
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 250m, memory: 256Mi }
    podSecurityContext: {}
    securityContext: {}
  telegramBotApi:
    kind: backend
    enabled: false
    replicas: 1
    port: 80
    servicePort: 80
    livenessPath: /live
    readinessPath: /ready
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/telegram-bot-api
      tag: latest
      digest: ''
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 250m, memory: 256Mi }
    podSecurityContext: {}
    securityContext: {}
  # telegramBotWorker is not deployed in Helm. It uses long-polling (local dev only).
  # In production, use telegramBotApi (webhook mode). Run the worker locally with:
  #   pnpm exec nx run telegram-bot-worker:start
  starterApp:
    kind: frontend
    enabled: false
    replicas: 2
    port: 8080
    servicePort: 80
    nginxConfig: true
    livenessPath: /nginx-health
    readinessPath: /nginx-health
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/starter-app
      tag: latest
      digest: ''
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }
    podSecurityContext: {}
    securityContext: {}
  landingApp:
    kind: frontend
    enabled: true
    replicas: 2
    port: 8080
    servicePort: 80
    nginxConfig: true
    livenessPath: /nginx-health
    readinessPath: /nginx-health
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/landing-app
      tag: latest
      digest: ''
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }
    podSecurityContext: {}
    securityContext: {}
  siteApp:
    kind: frontend
    enabled: true
    replicas: 2
    port: 80
    servicePort: 80
    livenessPath: /live
    readinessPath: /ready
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/site-app
      tag: latest
      digest: ''
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 300m, memory: 256Mi }
    podSecurityContext: {}
    securityContext: {}
  mobileApp:
    kind: frontend
    enabled: true
    replicas: 2
    port: 8080
    servicePort: 80
    nginxConfig: true
    livenessPath: /nginx-health
    readinessPath: /nginx-health
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/mobile-app
      tag: latest
      digest: ''
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }
    podSecurityContext: {}
    securityContext: {}
  userApp:
    kind: frontend
    enabled: true
    replicas: 2
    port: 8080
    servicePort: 80
    nginxConfig: true
    livenessPath: /nginx-health
    readinessPath: /nginx-health
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/user-app
      tag: latest
      digest: ''
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }
    podSecurityContext: {}
    securityContext: {}
  adminApp:
    kind: frontend
    enabled: true
    replicas: 2
    port: 8080
    servicePort: 80
    nginxConfig: true
    livenessPath: /nginx-health
    readinessPath: /nginx-health
    image:
      repository: ghcr.io/your-github-org/nest-react-boilerplate/admin-app
      tag: latest
      digest: ''
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }
    podSecurityContext: {}
    securityContext: {}

ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '10m'
  # Defaults model split-host frontend/API origins. starterApp has no permanent
  # host: when the starter preset is selected, assign the product-owned host in
  # environment values and disable the reference frontend it replaces.
  # For same-origin/path-based
  # routing, keep API prefixes (/auth, /profile, /admin) and SPA service paths
  # explicit in an environment values file and verify asset routing before
  # traffic cutover; see docs/frontend-deployment-topology.md.
  hosts:
    - host: example.com
      service: landing-app
      paths: ['/']
    - host: site.example.com
      service: site-app
      paths: ['/']
    - host: app.example.com
      service: user-app
      paths: ['/']
    - host: mobile.example.com
      service: mobile-app
      paths: ['/']
    - host: admin.example.com
      service: admin-app
      paths: ['/']
    - host: auth.example.com
      service: auth-app-api
      paths: ['/']
    - host: api.example.com
      service: user-app-api
      paths: ['/']
    - host: admin-api.example.com
      service: admin-app-api
      paths: ['/']
    # Bot webhook APIs are deployable but opt-in because they require provider
    # credentials and callback registration. Enable the matching app and route
    # together, then add the host to ingress.tls and provision DNS.
    - host: discord-api.example.com
      service: discord-app-api
      paths: ['/']
      enabled: false
    - host: telegram-api.example.com
      service: telegram-bot-api
      paths: ['/']
      enabled: false
  tls:
    - secretName: nest-react-boilerplate-tls
      hosts:
        - example.com
        - site.example.com
        - app.example.com
        - mobile.example.com
        - admin.example.com
        - auth.example.com
        - api.example.com
        - admin-api.example.com

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilization: 70
  scaleDownStabilizationWindow: 300
  scaleUpStabilizationWindow: 0

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

monitoring:
  enabled: false
  otel:
    # Enables the app's OpenTelemetry SDK. If endpoint is empty and the in-cluster
    # collector is enabled, pods export to that collector over OTLP/HTTP.
    enabled: false
    endpoint: ''
    headers: ''
    metricExportInterval: '60000'
    serviceVersion: ''
  otelCollector:
    enabled: false
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: 0.113.0
      pullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: ['ALL'] }
    config: |
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      processors:
        memory_limiter:
          check_interval: 1s
          limit_mib: 384
        batch: {}
      exporters:
        prometheus:
          endpoint: 0.0.0.0:9464
          resource_to_telemetry_conversion:
            enabled: true
        otlp:
          endpoint: tempo.observability.svc.cluster.local:4317
          tls:
            insecure: true
        debug:
          verbosity: basic
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133
      service:
        extensions: [health_check]
        pipelines:
          metrics:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [prometheus]
          traces:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlp, debug]
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    # SLOs used by the default alert rules. Tune per environment.
    availabilityTarget: '99.9'
    p95LatencySeconds: 1
    errorRateRatio: 0.05
  grafanaDashboard:
    enabled: false
    labels:
      grafana_dashboard: '1'

backups:
  enabled: false
  schedule: '17 * * * *'
  timeZone: 'Etc/UTC'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 900
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  image:
    repository: postgres
    tag: '16-alpine'
    pullPolicy: IfNotPresent
  destination:
    path: /backups
    pvc:
      enabled: false
      claimName: ''
    objectStore:
      enabled: false
      existingSecret: ''
      bucket: ''
      prefix: nest-react-boilerplate/postgres
  encryption:
    enabled: false
    # Provide a command such as: age -r "$AGE_RECIPIENT" -o "$BACKUP_FILE.age" "$BACKUP_FILE" && shred -u "$BACKUP_FILE" && BACKUP_FILE="$BACKUP_FILE.age"
    command: ''
    existingSecret: ''
  retention:
    keepLast: 168
    command: ''
  hooks:
    preBackup: ''
    upload: ''
    postBackup: ''
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 1000m, memory: 1Gi }
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: { drop: ['ALL'] }

networkPolicy:
  enabled: false

terminationGracePeriodSeconds: 60

# Coroot — auto-discovering application observability.
# Point at VictoriaMetrics or Prometheus; Coroot auto-detects K8s apps,
# builds topological maps, and shows real-time errors/SLOs.
coroot:
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/coroot/coroot
    tag: latest
    pullPolicy: IfNotPresent
  prometheusUrl: 'http://vmcluster-vmsingle.monitoring.svc.cluster.local:8429'
  service:
    type: ClusterIP
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: { drop: ['ALL'] }

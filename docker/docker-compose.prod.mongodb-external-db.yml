# Production database overlay: an externally managed MongoDB replica set.
# The URI is mounted as a secret and must include a non-empty replicaSet option.

x-mongodb-env: &mongodb-env
  DATABASE_ENGINE: mongodb
  AUTH_PERSISTENCE: mongodb
  MONGODB_DATABASE: ${MONGODB_DATABASE:-nest_react_boilerplate}
  MONGODB_REPLICA_SET: ${MONGODB_REPLICA_SET:?set the external MongoDB replica set name}
  MONGODB_MIN_POOL_SIZE: ${MONGODB_MIN_POOL_SIZE:-2}
  MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-10}
  MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-10000}

services:
  migrate:
    environment: *mongodb-env
    secrets: [mongodb_migration_uri]

  admin-app-api:
    environment: *mongodb-env
    secrets: [mongodb_uri]

  user-app-api:
    environment: *mongodb-env
    secrets: [mongodb_uri]

  auth-app-api:
    environment: *mongodb-env
    secrets: [mongodb_uri]

  discord-app-api:
    environment: *mongodb-env
    secrets: [mongodb_uri]

  telegram-bot-api:
    environment: *mongodb-env
    secrets: [mongodb_uri]

  notification-scheduler:
    environment: *mongodb-env
    secrets: [mongodb_uri]

  notification-consumer:
    environment: *mongodb-env
    secrets: [mongodb_uri]

secrets:
  mongodb_uri:
    file: ${MONGODB_URI_FILE:-./secrets/mongodb_uri.txt}
  mongodb_migration_uri:
    file: ${MONGODB_MIGRATION_URI_FILE:-./secrets/mongodb_migration_uri.txt}
  mongodb_backup_restore_uri:
    file: ${MONGODB_BACKUP_RESTORE_URI_FILE:-./secrets/mongodb_backup_restore_uri.txt}

# GitLab CI — one of two renderings of the same gate inventory.
#
# The list of gates that must pass before a change merges lives in
# scripts/ci/gates.json, NOT in this file and not in .github/workflows. Both
# forges render that descriptor and `node scripts/ci/check-pipelines.mjs` fails
# the pipeline when either rendering drops a gate, misses the aggregate job, or
# loses a release supply-chain control. Add a gate to the descriptor first, then
# wire it into both files. See docs/ci-lanes.md for the rendered matrix.
#
# Three things this file gets deliberately right, each of which was wrong before:
#
#   1. `workflow:` — without it GitLab creates BOTH a branch pipeline and a merge
#      request pipeline for every push, doubling spend for no extra signal.
#   2. `interruptible: true` by default — a superseded pipeline is cancelled
#      rather than run to completion.
#   3. Caching — this file previously had none at all. `grep cache` matched only
#      `apk add --no-cache`, so every job re-downloaded the pnpm store and every
#      Nx task ran cold on every pipeline.

stages:
  - security
  - validate
  - test
  - build
  - e2e
  - reports
  - release

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == 'schedule'
    - if: $CI_PIPELINE_SOURCE == 'web'
    - when: never

default:
  interruptible: true

variables:
  CI: 'true'
  NX_DAEMON: 'false'
  PNPM_VERSION: '11.15.1'
  NODE_VERSION_FILE: .nvmrc
  # Matches .github/workflows/ci.yml so a cache entry means the same thing on
  # both providers.
  NX_CACHE_DIRECTORY: .nx/cache
  PNPM_STORE_DIR: .pnpm-store
  # Full history: `nx affected` and the spec-evidence lane both diff against a
  # base commit, and GitLab's default depth of 20 silently breaks them.
  GIT_DEPTH: '0'
  # Release supply-chain toolchain. Pinned for the same reason the GitHub side
  # pins action SHAs: an unpinned signer or scanner is an unreviewed dependency
  # in the release path.
  SYFT_VERSION: v1.18.0
  TRIVY_VERSION: v0.72.0
  COSIGN_VERSION: v2.4.1

# Shared Node setup: pnpm store cache, Nx local cache, and the self-hosted
# remote cache when its variables are configured.
#
# The remote cache is env-only by design — docs/ci-cache.md forbids a token in
# nx.json, source, or image build args. Nx 23 resolves it from
# NX_SELF_HOSTED_REMOTE_CACHE_SERVER; note that a plain S3/MinIO bucket URL does
# NOT work, because Nx speaks GET/PUT on <base>/v1/cache/<hash>. When the
# variables are unset (forks, or before the cache server exists) Nx falls back to
# the local cache silently, which is intended.
#
# Write access is restricted to the default branch: an MR pipeline that could
# write cache entries main later reads is a supply-chain write primitive.
.node:
  image: node:24.18.0-alpine
  variables:
    NX_SELF_HOSTED_REMOTE_CACHE_SERVER: $NX_REMOTE_CACHE_URL
    NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: $NX_REMOTE_CACHE_TOKEN_READ
  before_script:
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm config set store-dir $PNPM_STORE_DIR
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && [ -n "$NX_REMOTE_CACHE_TOKEN_WRITE" ]; then
        export NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN="$NX_REMOTE_CACHE_TOKEN_WRITE"
      fi
    - pnpm install --frozen-lockfile --prefer-offline
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - .pnpm-store
      policy: pull-push
    # Per-job local cache, which is only a fallback: cross-job and cross-provider
    # reuse comes from the remote cache above.
    - key: nx-$CI_JOB_NAME
      paths:
        - .nx/cache
      policy: pull-push

# Include GitLab SAST/Dependency Scanning
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml

gitleaks:
  image: zricethezav/gitleaks:v8.28.0
  stage: security
  script:
    - gitleaks detect --source=. --report-format json --report-path gl-security-report.json
  artifacts:
    reports:
      secret_detection: gl-security-report.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

helm-validation:
  stage: validate
  image: node:24.18.0-alpine
  services:
    - docker:27.5.1-dind
  before_script:
    - apk add --no-cache curl git jq python3 make bash docker-cli docker-cli-compose
    - curl -fsSL https://get.helm.sh/helm-v4.2.2-linux-amd64.tar.gz | tar xz
    - mv linux-amd64/helm /usr/local/bin/
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  parallel:
    matrix:
      - HELM_SELECTION: provider-free
        SETUP_ARGS: '--replace --app landing-app --non-interactive'
      - HELM_SELECTION: postgres
        SETUP_ARGS: '--replace --app auth-app-api --capability postgres --non-interactive'
      - HELM_SELECTION: mongodb
        SETUP_ARGS: '--replace --app auth-app-api --capability mongodb --non-interactive'
  script:
    # Forge-neutral: asserts this file and .github/workflows/ci.yml both render
    # every gate in scripts/ci/gates.json. This replaced a call to
    # scripts/validate-github-workflows.mjs, which polices GitHub workflow
    # hardening and therefore proves nothing about a GitLab-hosted product.
    - node scripts/ci/check-pipelines.mjs
    - pnpm nrb setup $SETUP_ARGS
    - pnpm run deploy:validate:helm
  variables:
    REQUIRE_HELM: 'true'
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
  timeout: 10m

# Cheap, fail-fast gates only. Everything expensive lives in `full-check`, which
# this job gates. Previously both jobs ran lint, typecheck and the whole test
# suite over all 75+ projects — the same work twice per pipeline, with no cache.
fast-check:
  extends: .node
  stage: test
  script:
    - |
      if [ -n "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}" ]; then
        git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        export FORMAT_BASE_REF="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        pnpm run git:conventions -- --branch "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" --range "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME..HEAD"
      else
        git fetch origin "$CI_DEFAULT_BRANCH"
        export FORMAT_BASE_REF="origin/$CI_DEFAULT_BRANCH"
        pnpm run git:conventions -- --branch "$CI_COMMIT_BRANCH" --range "$CI_COMMIT_BEFORE_SHA..HEAD"
      fi
    # The same aggregate GitHub's fast-check runs, rather than a hand-copied
    # subset that silently fell four gates behind. `ci:pr` expands to:
    #   pnpm run tooling:static-check && pnpm run docs:check &&
    #   pnpm run i18n:catalogs:check && pnpm run spec:validate &&
    #   pnpm run format:changed && pnpm run test:security:secrets &&
    #   pnpm run test:security:sast && pnpm run audit:ci
    - pnpm run ci:pr
  timeout: 15m

spec-evidence:
  stage: test
  image: node:24.18.0-alpine
  needs:
    - fast-check
  variables:
    GIT_DEPTH: '0'
  before_script:
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - |
      if [ -n "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}" ]; then
        git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        lane=pr
        base="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      else
        lane=main
        base="$CI_COMMIT_BEFORE_SHA"
        if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
          base="$(git rev-parse HEAD^)"
        fi
      fi
      pnpm run spec:verify -- \
        --lane "$lane" \
        --base "$base" \
        --head HEAD \
        --report test-results/spec-evidence/gitlab.json
  artifacts:
    when: always
    paths:
      - test-results/spec-evidence/
    expire_in: 14 days
  timeout: 45m

non-runtime-validation:
  extends: .node
  stage: test
  needs:
    - fast-check
  script:
    - pnpm run onboarding:verify
    - pnpm run db:migrations:check
    - pnpm run lib:configs:check
    - pnpm run frontend:fsd:check
    - pnpm run api:toast-config:check
    - pnpm run audit:licenses
    - pnpm run audit:full
    - pnpm run api:contracts:check
    - pnpm run api:clients:check
    - pnpm run api:openapi:lint
    - pnpm run api:contracts:consumer
    - pnpm run api:openapi:fuzz
    - pnpm run test:property
    # Deployment configuration. The GitOps validator reads its pipeline set from
    # scripts/ci/gates.json, so it validates whichever forges this checkout ships and
    # leaves the rest to the supply-chain controls that ci-pipeline-parity evaluates.
    - pnpm run deploy:validate:pm2
    - pnpm run deploy:validate:gitops
  timeout: 30m

bun-compat:
  extends: .node
  stage: test
  needs:
    - fast-check
  parallel:
    matrix:
      - BUN_CLOSURE: provider-free
        SETUP_ARGS: '--replace --app landing-app --non-interactive'
      - BUN_CLOSURE: standalone-site
        SETUP_ARGS: '--replace --app site-app --non-interactive'
      - BUN_CLOSURE: standalone-user-frontend
        SETUP_ARGS: '--replace --app user-app --capability postgres --non-interactive'
      - BUN_CLOSURE: standalone-admin-frontend
        SETUP_ARGS: '--replace --app admin-app --capability postgres --non-interactive'
      - BUN_CLOSURE: standalone-mobile
        SETUP_ARGS: '--replace --app mobile-app --capability postgres --non-interactive'
      - BUN_CLOSURE: standalone-user-api
        SETUP_ARGS: '--replace --app user-app-api --capability postgres --non-interactive'
      - BUN_CLOSURE: standalone-admin-api
        SETUP_ARGS: '--replace --app admin-app-api --capability postgres --non-interactive'
      - BUN_CLOSURE: standalone-discord-api
        SETUP_ARGS: '--replace --app discord-app-api --capability postgres --non-interactive'
      - BUN_CLOSURE: standalone-telegram-api
        SETUP_ARGS: '--replace --app telegram-bot-api --capability postgres --non-interactive'
      - BUN_CLOSURE: preset-minimal
        SETUP_ARGS: '--preset minimal --non-interactive'
      - BUN_CLOSURE: preset-web
        SETUP_ARGS: '--preset web --non-interactive'
      - BUN_CLOSURE: preset-fullstack
        SETUP_ARGS: '--preset fullstack --non-interactive'
      - BUN_CLOSURE: preset-enterprise
        SETUP_ARGS: '--preset enterprise --non-interactive'
      - BUN_CLOSURE: preset-bots
        SETUP_ARGS: '--preset bots --non-interactive'
      - BUN_CLOSURE: mongodb-core
        SETUP_ARGS: '--replace --app auth-app-api --app user-app-api --capability mongodb --non-interactive'
      - BUN_CLOSURE: mongodb-bots
        SETUP_ARGS: '--replace --app auth-app-api --app user-app-api --app discord-app-api --app telegram-bot-api --capability mongodb --non-interactive'
  script:
    - apk add --no-cache bash curl unzip
    - curl -fsSL https://bun.sh/install | bash -s -- "bun-v$(cat .bun-version)"
    - export PATH="$HOME/.bun/bin:$PATH"
    - pnpm run tooling:install
    - pnpm nrb setup $SETUP_ARGS
    - pnpm nrb closure install
    - pnpm run bun:check
  timeout: 60m

full-check:
  extends: .node
  stage: test
  needs:
    - fast-check
  services:
    - postgres:17.6-alpine
  variables:
    NX_SELF_HOSTED_REMOTE_CACHE_SERVER: $NX_REMOTE_CACHE_URL
    NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: $NX_REMOTE_CACHE_TOKEN_READ
    POSTGRES_DB: app_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: 'postgresql://postgres:postgres@postgres:5432/app_test'
    TEST_DB_URL: 'postgresql://postgres:postgres@postgres:5432/app_test'
  script:
    - pnpm run format:check
    # Affected on a merge request, everything on the default branch. The base is
    # GitLab's own diff-base SHA, which is why GIT_DEPTH must be 0.
    - |
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        pnpm exec nx affected -t lint typecheck build --base="$CI_MERGE_REQUEST_DIFF_BASE_SHA" --head=HEAD
        pnpm exec nx affected -t test --base="$CI_MERGE_REQUEST_DIFF_BASE_SHA" --head=HEAD -- --coverage
        pnpm run test:bundle-budget -- --skip-missing
      else
        pnpm run lint:all
        pnpm run typecheck:all
        pnpm run build:all
        pnpm run test:coverage:all
        pnpm run test:bundle-budget
      fi
  timeout: 60m

component-tests:
  stage: test
  image: node:24.18.0-alpine
  needs:
    - fast-check
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    TESTCONTAINERS_HOST_OVERRIDE: docker
  before_script:
    - apk add --no-cache docker-cli
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm exec nx run @app/backend-feature-auth-test:component-test
  timeout: 30m

mongodb-validation:
  stage: test
  image: node:24.18.0-alpine
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
  before_script:
    - apk add --no-cache docker-cli
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - node --test --import jiti/register packages/tooling/src/commands/db/mongo-migrate.component.test.ts
    - pnpm exec nx run-many -t component-test --projects=@app/backend-mongodb-main,@app/backend-mongodb-main-auth,@app/backend-mongodb-main-feature-flags,@app/backend-mongodb-main-notification --parallel=1
    - pnpm exec nx run-many -t test --projects=@app/backend-feature-auth-main,@app/backend-feature-admin-main,@app/backend-feature-notification-main
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  timeout: 35m

e2e-tests:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.61.1-noble
  before_script:
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm run test:e2e:coverage:all
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  timeout: 15m

docker-smoke-test:
  stage: build
  image: node:24.18.0-alpine
  services:
    - docker:27.5.1-dind
  before_script:
    - apk add --no-cache curl git jq python3 make bash docker-cli docker-cli-compose
    - corepack enable pnpm
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm nrb closure materialize --all-reference --provider postgres
    - pnpm nrb closure materialize --all-reference --provider mongodb
    - pnpm run test:docker-smoke
    - pnpm run test:compose-deployment-modes
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    NRB_CLOSURE_CONTEXT: '$CI_PROJECT_DIR/.nrb/reference/postgres'
  timeout: 30m

docker-fullstack:
  stage: e2e
  image: node:24.18.0-alpine
  services:
    - docker:27.5.1-dind

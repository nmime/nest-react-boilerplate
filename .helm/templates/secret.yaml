{{- if .Values.secrets.existingSecret }}
{{- /* External secret supplied; do not render an in-chart Secret. */ -}}
{{- else if .Values.secrets.create }}
{{- $authJwtSecret := required "secrets.authJwtSecret is required when secrets.create=true" .Values.secrets.authJwtSecret -}}
{{- $betterAuthSecret := required "secrets.betterAuthSecret is required when secrets.create=true" .Values.secrets.betterAuthSecret -}}
{{- $databaseUrl := required "secrets.databaseUrl is required when secrets.create=true" .Values.secrets.databaseUrl -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "boilerplate.secretName" . }}
  labels:
    {{- include "boilerplate.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_JWT_SECRET: {{ $authJwtSecret | quote }}
  BETTER_AUTH_SECRET: {{ $betterAuthSecret | quote }}
  DATABASE_URL: {{ $databaseUrl | quote }}
  {{- if .Values.secrets.telegramBotToken }}
  TELEGRAM_BOT_TOKEN: {{ .Values.secrets.telegramBotToken | quote }}
  {{- end }}
  {{- if .Values.secrets.telegramOidcClientSecret }}
  TELEGRAM_OIDC_CLIENT_SECRET: {{ .Values.secrets.telegramOidcClientSecret | quote }}
  {{- end }}
{{- else }}
{{- fail "Set secrets.existingSecret, or set secrets.create=true with secrets.authJwtSecret, secrets.betterAuthSecret, and secrets.databaseUrl." }}
{{- end }}

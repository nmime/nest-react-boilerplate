services:
  auth-app-api:
    environment:
      AUTH_TELEGRAM_ENABLED: 'true'
      TELEGRAM_OIDC_ENABLED: ${TELEGRAM_OIDC_ENABLED:-true}
      TELEGRAM_OIDC_CLIENT_ID: ${TELEGRAM_OIDC_CLIENT_ID:?set Telegram OIDC client id from BotFather}
      TELEGRAM_OIDC_SCOPES: ${TELEGRAM_OIDC_SCOPES:-openid profile}
      TELEGRAM_TMA_MAX_AGE_SECONDS: ${TELEGRAM_TMA_MAX_AGE_SECONDS:-300}
    secrets:
      - session_secret
      - better_auth_secret
      - telegram_bot_token
      - telegram_oidc_client_secret

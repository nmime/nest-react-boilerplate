name: Promote GitOps release

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: 'Full 40-character Git SHA whose release images already exist'
        required: true
        type: string

permissions:
  contents: write
  packages: read
  pull-requests: write

concurrency:
  group: gitops-promotion
  cancel-in-progress: false

env:
  HELM_VERSION: v4.2.3

jobs:
  promote:
    name: Validate images and open promotion PR
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Require the deployment token
        env:
          DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::GH_DEPLOY_TOKEN with repository, pull-request, and package read access is required"
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GH_DEPLOY_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Validate the source revision
        id: revision
        env:
          REQUESTED_SHA: ${{ inputs.git_sha }}
        run: |
          SHA=$(printf '%s' "$REQUESTED_SHA" | tr '[:upper:]' '[:lower:]')
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::git_sha must be a full 40-character hexadecimal Git SHA"
            exit 1
          fi
          git fetch --no-tags origin main
          git cat-file -e "$SHA^{commit}"
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not an ancestor of origin/main"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=gitops/sha-$SHA" >> "$GITHUB_OUTPUT"

      - name: Require initialized deployment ownership
        run: |
          if grep -R -n -E 'your-github-org|sha-REPLACE_WITH_RELEASE_GIT_SHA' \
            .helm/values-production.yaml deploy/argocd deploy/flux; then
            echo "::error::Run pnpm nrb init and commit product-owned registry/repository values before promotion"
            exit 1
          fi

      - name: Collect candidate release image digests
        id: candidate-images
        env:
          DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
          IMAGE_TAG: ${{ steps.revision.outputs.tag }}
          RELEASE_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$DEPLOY_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          mapfile -t images < <(node scripts/release-image-plan.mjs --names)
          updates=()
          promoted=()
          for image in "${images[@]}"; do
            reference="ghcr.io/${{ github.repository }}/$image:$IMAGE_TAG"
            if digest="$(docker manifest inspect --verbose "$reference" 2>/dev/null | jq -r '.Descriptor.digest // empty')"; then
              if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                updates+=(--image "$image=$digest")
                promoted+=("$image")
                continue
              fi
            fi
            echo "Release image not present for this SHA; retaining the currently promoted $image digest"
          done
          if [ "${#updates[@]}" -eq 0 ]; then
            echo "::error::No release images were found for $IMAGE_TAG"
            exit 1
          fi
          python3 scripts/update-deploy-tags.py "$RELEASE_SHA" "${updates[@]}"
          (IFS=,; echo "images=${promoted[*]}") >> "$GITHUB_OUTPUT"
          echo "count=${#promoted[@]}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Validate the promoted chart
        run: |
          helm lint .helm -f .helm/values-production.yaml
          helm template nest-react-boilerplate .helm \
            -f .helm/values.yaml \
            -f .helm/values-production.yaml \
            --namespace nest-react-boilerplate >/dev/null
          node scripts/validate-gitops-config.mjs

      - name: Commit the promotion branch
        id: commit
        env:
          BRANCH: ${{ steps.revision.outputs.branch }}
          IMAGE_TAG: ${{ steps.revision.outputs.tag }}
          PROMOTED_IMAGES: ${{ steps.candidate-images.outputs.images }}
        run: |
          if git diff --quiet -- .helm/values-production.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Production values already use the candidate digests for $IMAGE_TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add .helm/values-production.yaml
          git commit -m "deploy: promote $IMAGE_TAG (${PROMOTED_IMAGES})"
          git push --force-with-lease origin "HEAD:$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or reuse the promotion PR
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
          BRANCH: ${{ steps.revision.outputs.branch }}
          IMAGE_TAG: ${{ steps.revision.outputs.tag }}
          PROMOTED_IMAGES: ${{ steps.candidate-images.outputs.images }}
        run: |
          PR_URL=$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "deploy: promote $IMAGE_TAG" \
              --body "Promotes the verified immutable digests for \`$PROMOTED_IMAGES\` from \`$IMAGE_TAG\`. Unchanged workloads retain their currently deployed digests. Merge this PR to let Argo CD or Flux reconcile the release.")
          fi
          echo "Promotion PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"

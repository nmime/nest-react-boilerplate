{{- $root := . -}}
{{- $databaseEngine := include "boilerplate.databaseEngine" . -}}
{{- $runtimeSecretKeys := list
  "SESSION_SECRET"
  "AUTH_LOGIN_ANALYTICS_IP_HASH_SECRET"
  "BETTER_AUTH_SECRET"
  "AUTH_PROVIDER_TOKEN_ENCRYPTION_KEY"
  "NOTIFICATION_PAYLOAD_ENCRYPTION_KEY"
  "TELEGRAM_BOT_TOKEN"
  "TELEGRAM_OIDC_CLIENT_SECRET"
  "TELEGRAM_BOT_WEBHOOK_SECRET"
  "DISCORD_BOT_TOKEN"
  "DISCORD_CLIENT_SECRET"
  "DISCORD_PUBLIC_KEY"
  "DISCORD_CUSTOM_ID_SECRET"
  "RESEND_API_KEY"
  "MAILPACE_SERVER_TOKEN"
  "NOTIFICATION_FCM_PRIVATE_KEY"
  "NOTIFICATION_APNS_PRIVATE_KEY"
  "REDIS_PASSWORD"
  "S3_ACCESS_KEY"
  "S3_SECRET_KEY"
  "OTEL_EXPORTER_OTLP_HEADERS"
  "OTEL_EXPORTER_OTLP_METRICS_HEADERS"
  "OTEL_EXPORTER_OTLP_TRACES_HEADERS"
-}}
{{- range $name, $app := .Values.apps }}
{{- if $app.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "boilerplate.fullname" $root }}-{{ kebabcase $name }}
  labels:
    {{- include "boilerplate.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ kebabcase $name }}
spec:
  {{- if not $root.Values.autoscaling.enabled }}
  replicas: {{ $app.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "boilerplate.name" $root }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ kebabcase $name }}
  template:
    metadata:
      labels:
        {{- include "boilerplate.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ kebabcase $name }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $app.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ default 60 $.Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ kebabcase $name }}
          image: {{ include "boilerplate.image" (dict "name" $name "image" $app.image) | quote }}
          imagePullPolicy: {{ default "IfNotPresent" $app.image.pullPolicy }}
          {{- with $app.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if ne $app.kind "background" }}
          ports:
            - name: http
              containerPort: {{ $app.port }}
          {{- end }}
          env:
            {{- if ne $app.kind "background" }}
            # Keep the application listener aligned with the chart container
            # port. Nginx frontends ignore this variable.
            - name: PORT
              value: {{ $app.port | quote }}
            {{- end }}
            {{- if eq $app.kind "frontend" }}
            {{- /*
              Browser-safe runtime flags. The SPA entrypoint renders these into
              runtime-config.js at container start, so one immutable image serves
              every environment (no Vite rebuild to toggle a feature).
            */ -}}
            {{- range $flag, $value := $root.Values.frontendRuntimeConfig }}
            - name: {{ $flag }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if and (eq (kebabcase $name) "landing-app") $root.Values.ingress.enabled $root.Values.apps.userApp.enabled }}
            - name: LANDING_USER_APP_URL
              value: {{ include "boilerplate.landingAppDestination" (dict "root" $root "service" "user-app" "fallback" "/app") | quote }}
            {{- end }}
            {{- if and (eq (kebabcase $name) "landing-app") $root.Values.ingress.enabled $root.Values.apps.adminApp.enabled }}
            - name: LANDING_ADMIN_APP_URL
              value: {{ include "boilerplate.landingAppDestination" (dict "root" $root "service" "admin-app" "fallback" "/admin") | quote }}
            {{- end }}
            {{- end }}
            {{- if or (eq $app.kind "backend") (eq $app.kind "background") }}
            {{- range $runtimeSecretKeys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "boilerplate.secretName" $root }}
                  key: {{ . }}
                  optional: true
            {{- end }}
            - name: {{ ternary "DATABASE_URL" "MONGODB_URI" (eq $databaseEngine "postgres") }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "boilerplate.secretName" $root }}
                  key: {{ ternary "DATABASE_URL" "MONGODB_URI" (eq $databaseEngine "postgres") }}
                  optional: true
            {{- end }}
          {{- if or (eq $app.kind "backend") (eq $app.kind "background") }}
          envFrom:
            {{- if $root.Values.config.extra }}
            {{- /* First, so the chart's own ConfigMap below wins on a duplicate key. */}}
            - configMapRef:
                name: {{ include "boilerplate.fullname" $root }}-product-config
            {{- end }}
            - configMapRef:
                name: {{ include "boilerplate.fullname" $root }}-config
          {{- end }}
          {{- if and $root.Values.frontendNginx.enabled $app.nginxConfig }}
          volumeMounts:
            - name: frontend-nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          {{- end }}
          {{- if ne $app.kind "background" }}
          readinessProbe:
            httpGet:
              path: {{ default (ternary "/ready" "/" (eq $app.kind "backend")) $app.readinessPath | quote }}
              port: http
            initialDelaySeconds: {{ default 10 $app.readinessInitialDelaySeconds }}
            periodSeconds: {{ default 10 $app.readinessPeriodSeconds }}
            timeoutSeconds: {{ default 3 $app.readinessTimeoutSeconds }}
            failureThreshold: {{ default 6 $app.readinessFailureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ default (ternary "/live" "/" (eq $app.kind "backend")) $app.livenessPath | quote }}
              port: http
            initialDelaySeconds: {{ default 20 $app.livenessInitialDelaySeconds }}
            periodSeconds: {{ default 20 $app.livenessPeriodSeconds }}
            timeoutSeconds: {{ default 3 $app.livenessTimeoutSeconds }}
            failureThreshold: {{ default 3 $app.livenessFailureThreshold }}
          startupProbe:
            httpGet:
              path: {{ default (ternary "/live" "/" (eq $app.kind "backend")) $app.startupProbePath | quote }}
              port: http
            initialDelaySeconds: {{ default 0 $app.startupInitialDelaySeconds }}
            periodSeconds: {{ default 10 $app.startupPeriodSeconds }}
            timeoutSeconds: {{ default 5 $app.startupTimeoutSeconds }}
            failureThreshold: {{ default 30 $app.startupFailureThreshold }}
          {{- end }}
          resources:
            {{- toYaml $app.resources | nindent 12 }}
      {{- if and $root.Values.frontendNginx.enabled $app.nginxConfig }}
      volumes:
        - name: frontend-nginx-config
          configMap:
            name: {{ include "boilerplate.fullname" $root }}-frontend-nginx
            items:
              - key: default.conf
                path: default.conf
      {{- end }}
{{- end }}
{{- end }}
